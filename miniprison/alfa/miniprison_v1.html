<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MiniPrison</title>
<style>
  html, body { margin:0; padding:0; background:#1a1a2e; overflow:hidden; height:100%; }
  canvas { display:block; margin:0 auto; background:#1a1a2e; }
  #hud {
    position:fixed; top:8px; left:8px; color:#ccc;
    font:12px monospace; background:rgba(0,0,0,.5);
    padding:6px 10px; border-radius:4px; pointer-events:none;
    line-height:1.5;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<script>
"use strict";

/* =========================================================
   CONFIGURACIÓN GLOBAL
   ========================================================= */
const TILE = 32;            // tamaño de celda en píxeles
const COLS = 30;            // celdas horizontales
const ROWS = 20;            // celdas verticales
const W = TILE * COLS;
const H = TILE * ROWS;

const TICK_MS = 1000;       // la simulación corre 1 vez por segundo
const VISION_DIST = 5 * TILE; // alcance del cono de visión
const VISION_ANGLE = Math.PI / 4; // 45° total del cono
const NPC_RADIUS = 9;
const NPC_SPEED = 1.5;      // píxeles por tick

// Paleta
const COLORS = {
  bg: "#1a1a2e",
  grid: "rgba(255,255,255,0.06)",
  prisoner: "#e63946",
  guard: "#457b9d",
  worker: "#f4a261",
  vision: "rgba(255,255,255,0.15)"
};

/* =========================================================
   ESTADO DEL JUEGO
   ========================================================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

canvas.width = W;
canvas.height = H;

/** Lista de NPCs activos */
const npcs = [];

/** Marcas de tiempo */
let lastTick = performance.now();

/* =========================================================
   CLASE NPC
   ========================================================= */
class NPC {
  constructor(tipo, x, y, color) {
    this.tipo = tipo;                 // "prisoner" | "guard" | "worker"
    this.x = x;                       // posición en píxeles
    this.y = y;
    this.color = color;
    this.dir = Math.random() * Math.PI * 2; // dirección (radianes)
    this.target = null;               // waypoint {x, y} o null
    this.estado = "idle";             // "idle" | "walking"
    this.idleTicks = 0;               // ticks que lleva quieto
  }

  /** Elige un destino aleatorio en la celda del grid */
  pickTarget() {
    const tx = Math.floor(Math.random() * COLS);
    const ty = Math.floor(Math.random() * ROWS);
    this.target = {
      x: tx * TILE + TILE / 2,
      y: ty * TILE + TILE / 2
    };
    this.estado = "walking";
  }

  /** Actualiza posición un paso de simulación (1 tick) */
  update() {
    if (this.estado === "idle") {
      this.idleTicks++;
      if (this.idleTicks > 2 + Math.floor(Math.random() * 3)) {
        this.idleTicks = 0;
        this.pickTarget();
      }
      return;
    }

    if (!this.target) { this.estado = "idle"; return; }

    const dx = this.target.x - this.x;
    const dy = this.target.y - this.y;
    const dist = Math.hypot(dx, dy);

    if (dist < NPC_SPEED + 1) {
      // llegó
      this.x = this.target.x;
      this.y = this.target.y;
      this.target = null;
      this.estado = "idle";
      return;
    }

    // actualizar dirección para el cono de visión
    this.dir = Math.atan2(dy, dx);
    this.x += (dx / dist) * NPC_SPEED;
    this.y += (dy / dist) * NPC_SPEED;
  }

  /** Dibuja el NPC y su cono de visión */
  draw(ctx) {
    // Cono de visión (triángulo semitransparente)
    const a1 = this.dir - VISION_ANGLE / 2;
    const a2 = this.dir + VISION_ANGLE / 2;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x + Math.cos(a1) * VISION_DIST,
               this.y + Math.sin(a1) * VISION_DIST);
    ctx.lineTo(this.x + Math.cos(a2) * VISION_DIST,
               this.y + Math.sin(a2) * VISION_DIST);
    ctx.closePath();
    ctx.fillStyle = COLORS.vision;
    ctx.fill();

    // Cuerpo del NPC: círculo con borde
    ctx.beginPath();
    ctx.arc(this.x, this.y, NPC_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(0,0,0,0.7)";
    ctx.stroke();
  }
}

/* =========================================================
   INICIALIZACIÓN DEL MUNDO
   ========================================================= */
function spawnNPCs() {
  // 4 presos
  for (let i = 0; i < 4; i++)
    npcs.push(new NPC("prisoner", 80 + i * 40, 100, COLORS.prisoner));

  // 2 guardias
  for (let i = 0; i < 2; i++)
    npcs.push(new NPC("guard", 80 + i * 40, 300, COLORS.guard));

  // 2 obreros
  for (let i = 0; i < 2; i++)
    npcs.push(new NPC("worker", 80 + i * 40, 500, COLORS.worker));
}
spawnNPCs();

/* =========================================================
   LOOP DE SIMULACIÓN (TICKS)
   ========================================================= */
function tick() {
  for (const npc of npcs) npc.update();
}

/* =========================================================
   RENDER (60 FPS)
   ========================================================= */
function drawGrid() {
  ctx.strokeStyle = COLORS.grid;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x += TILE) {
    ctx.moveTo(x + 0.5, 0);
    ctx.lineTo(x + 0.5, H);
  }
  for (let y = 0; y <= H; y += TILE) {
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(W, y + 0.5);
  }
  ctx.stroke();
}

function render() {
  // fondo
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);

  // grid
  drawGrid();

  // NPCs
  for (const npc of npcs) npc.draw(ctx);
}

/* =========================================================
   LOOP PRINCIPAL
   ========================================================= */
let fpsTimer = 0;
let fpsCount = 0;
let fps = 0;

function loop(now) {
  // Simulación por ticks
  if (now - lastTick >= TICK_MS) {
    // si el navegador estuvo mucho tiempo pausado, ejecutar sólo 1 tick
    lastTick = now;
    tick();
  }

  // Render a 60fps
  render();

  // HUD
  fpsCount++;
  if (now - fpsTimer >= 1000) {
    fps = fpsCount;
    fpsCount = 0;
    fpsTimer = now;
  }
  hud.textContent =
    `MiniPrison | FPS: ${fps} | NPCs: ${npcs.length} | ` +
    `Tick: 1s | Grid: ${COLS}x${ROWS}`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
