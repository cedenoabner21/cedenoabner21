<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MiniPrison — v17.1 (optimizada)</title>
<style>
  html, body { margin:0; padding:0; background:#1a1a2e; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
"use strict";

/* =========================================================
   CONFIGURACIÓN GLOBAL
   ========================================================= */
const TILE = 32;
const COLS = 60;
const ROWS = 40;
const GRID_W = TILE * COLS;
const GRID_H = TILE * ROWS;

const COLOR_BG = "#1a1a2e";
const COLOR_GRID = "rgba(255,255,255,0.08)";

const TICK_MS = 1000;
const TICKS_POR_DIA = 60;
const MINUTOS_POR_DIA = 1440;

const NPC_RADIUS = 8;
const VISION_RADIUS = 64;
const VISION_FOV = Math.PI / 3;
const VISION_ALPHA = 0.15;

const NPC_COLORS = { preso: "#ff4444", guardia: "#4488ff" };
const NPC_SPEEDS = { preso: 55, guardia: 80 };

const SPEED_INQUIETO = 1.6;

const DIA_VICTORIA      = 10;
const PRESOS_PARA_GANAR = 20;
const PRESOS_MINIMOS    = 5;
const MOTINES_MAX       = 3;
const FUGAS_MAX         = 3;

const TIPOS_CELDA = {
  vacio:     { color: null,      coste: 0  },
  muro:      { color: "#555555", coste: 10 },
  celda:     { color: "#333355", coste: 50 },
  comedor:   { color: "#335533", coste: 30 },
  ducha:     { color: "#334455", coste: 30 },
  patio:     { color: "#555533", coste: 20 },
  carretera: { color: "#252525", coste: 0, noPintable: true }
};

const TECLAS_TIPO = ["vacio", "muro", "celda", "comedor", "ducha", "patio"];

const FASE_AMANECER = { r: 255, g: 140, b: 60,  a: 0.10 };
const FASE_MEDIODIA = { r: 255, g: 230, b: 180, a: 0.03 };
const FASE_TARDE    = { r: 255, g: 120, b: 60,  a: 0.09 };
const FASE_NOCHE    = { r: 10,  g: 10,  b: 40,  a: 0.22 };

const DECAIMIENTO_HAMBRE   = 2;
const DECAIMIENTO_HIGIENE  = 1;
const DECAIMIENTO_LIBERTAD = 0.3;
const PROB_HUIDA           = 0.25;
const LIBERTAD_PARA_CELDA  = 40;
const LIBERTAD_AL_DESCANSAR = 30;

const GRACIA_HUIDA_TICKS = 5;

const FRANJAS_DIA = 6;
const TICKS_POR_FRANJA = TICKS_POR_DIA / FRANJAS_DIA;
const ACTIVIDADES = ["celda", "ducha", "comedor", "patio", "libre"];
const horario = ["celda", "ducha", "comedor", "patio", "comedor", "celda"];

const CARRETERA_FILA_INICIO = ROWS - 3;
const CARRETERA_FILA_FIN    = ROWS - 1;
const CARRETERA_Y = (CARRETERA_FILA_INICIO + 1) * TILE + TILE / 2;
const ENTREGA_X   = GRID_W / 2;

const CAMION_VELOCIDAD = 170;
const CAMION_ANCHO = 88;
const CAMION_ALTO  = 36;
const CAMION_INTERVALO_PRESO = 0.7;
const CAMION_PAUSA_POST = 1.2;

const PRESOS_ENTREGA_INICIAL = 5;
const PRESOS_ENTREGA_DIARIA  = 2;

/* OPT #6: contador global que se incrementa cada vez que el mapa
   cambia. Sirve para invalidar el cache de puedeHuir() sin tener
   que recorrer todos los presos. */
let mapVersion = 0;

/* =========================================================
   CANVAS
   ========================================================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

/* OPT #6: DPR capado a 2. En pantallas retina dpr=2 evita
   multiplicar por 4-9 el coste de cada fillRect/drawImage. */
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(window.innerWidth  * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width  = window.innerWidth  + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================================================
   CÁMARA
   ========================================================= */
const cam = { x: GRID_W / 2, y: GRID_H / 2, zoom: 0.75, minZoom: 0.35, maxZoom: 2.5 };

function clampCamera() {
  const viewW = window.innerWidth  / cam.zoom;
  const viewH = window.innerHeight / cam.zoom;
  if (viewW >= GRID_W) cam.x = GRID_W / 2;
  else cam.x = Math.max(viewW / 2, Math.min(GRID_W - viewW / 2, cam.x));
  if (viewH >= GRID_H) cam.y = GRID_H / 2;
  else cam.y = Math.max(viewH / 2, Math.min(GRID_H - viewH / 2, cam.y));
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - window.innerWidth / 2) / cam.zoom + cam.x,
    y: (sy - window.innerHeight / 2) / cam.zoom + cam.y
  };
}
clampCamera();

/* =========================================================
   INPUT
   ========================================================= */
const keys = Object.create(null);
let espacioPulsado = false;

window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key.startsWith("Arrow")) e.preventDefault();
  if (estadoGlobal.mostrandoInstrucciones) {
    if (!e.repeat) {
      estadoGlobal.mostrandoInstrucciones = false;
      estadoGlobal.pausado = false;
      estadoGlobal.tickGracia = 0;
      lastTick = performance.now();
      lastFrameTime = performance.now();
    }
    return;
  }
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k >= "1" && k <= "6") tipoSeleccionado = TECLAS_TIPO[parseInt(k, 10) - 1];
  if (k === " " && !e.repeat && !espacioPulsado && !estadoGlobal.finDePartida) {
    espacioPulsado = true;
    estadoGlobal.pausado = !estadoGlobal.pausado;
  }
  if (k === "r" && !e.repeat && estadoGlobal.finDePartida) reiniciarPartida();
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === " ") espacioPulsado = false;
});
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  espacioPulsado = false;
});

/* =========================================================
   RATÓN
   ========================================================= */
let tipoSeleccionado = "muro";
let mouseDown = false;
let lastPaintCol = -1;
let lastPaintRow = -1;
let hoverCelda = null;

let panning = false;
let panStartX = 0, panStartY = 0, panStartCamX = 0, panStartCamY = 0;

function pantallaACelda(px, py) {
  const w = screenToWorld(px, py);
  if (w.x < 0 || w.y < 0 || w.x >= GRID_W || w.y >= GRID_H) return null;
  return { col: Math.floor(w.x / TILE), row: Math.floor(w.y / TILE) };
}

function pintarCelda(col, row, tipo) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return false;
  if (estadoGlobal.finDePartida) return false;
  if (estadoGlobal.mostrandoInstrucciones) return false;
  const celda = grid[row][col];
  if (celda.tipo === "carretera") return false;
  if (celda.tipo === "vacio" && tipo === "vacio") return false;
  if (celda.tipo === tipo) return false;
  const coste = TIPOS_CELDA[tipo].coste;
  if (estadoGlobal.dinero < coste) return false;
  estadoGlobal.dinero -= coste;

  if (celda.tipo === "celda" && tipo !== "celda" && celda.asignada) {
    celda.asignada = false;
    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (n.tipo === "preso" && n.celdaAsignada &&
          n.celdaAsignada.col === col && n.celdaAsignada.row === row) {
        n.celdaAsignada = null;
        n.recienLlegado = false;
      }
    }
  }

  celda.tipo = tipo;
  if (tipo === "celda") celda.asignada = false;
  gridDirty = true;

  /* OPT #1: invalidar cache de huida de TODOS los presos
     (mapVersion++ hace que el próximo puedeHuir() recalcule). */
  mapVersion++;

  if (tipo === "muro") {
    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (n.camino && n.camino.length > 0 && n.pasoActual < n.camino.length) {
        const paso = n.camino[n.pasoActual];
        if (paso.col === col && paso.row === row) n.caminoDirty = true;
      }
    }
  }

  return true;
}

function clicEnPanelHorario(px, py) {
  if (!panelHorario.visible) return false;
  const x = panelHorario.x, y = panelHorario.y;
  const w = panelHorario.w, h = panelHorario.h;
  if (px < x || px > x + w || py < y || py > y + h) return false;

  const filaH = 20;
  const inicioFilas = y + 30;
  for (let i = 0; i < FRANJAS_DIA; i++) {
    const fy = inicioFilas + i * filaH;
    if (py >= fy && py < fy + filaH) {
      const actActual = horario[i];
      const idx = ACTIVIDADES.indexOf(actActual);
      horario[i] = ACTIVIDADES[(idx + 1) % ACTIVIDADES.length];
      for (let j = 0; j < npcs.length; j++) {
        const n = npcs[j];
        if (n.tipo === "preso" && !n.huyendo && !n.recienLlegado) {
          n.camino = [];
          n.objetivo = null;
          n.objetivoTipo = null;
          n.caminoDirty = true;
        }
      }
      return true;
    }
  }
  return true;
}

canvas.addEventListener("mousedown", (e) => {
  if (estadoGlobal.mostrandoInstrucciones) {
    estadoGlobal.mostrandoInstrucciones = false;
    estadoGlobal.pausado = false;
    estadoGlobal.tickGracia = 0;
    lastTick = performance.now();
    lastFrameTime = performance.now();
    return;
  }
  if (e.button === 1) {
    panning = true;
    panStartX = e.clientX; panStartY = e.clientY;
    panStartCamX = cam.x; panStartCamY = cam.y;
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  if (estadoGlobal.finDePartida) return;
  if (clicEnPanelHorario(e.clientX, e.clientY)) return;

  const celda = pantallaACelda(e.clientX, e.clientY);
  if (!celda) return;
  mouseDown = true;
  pintarCelda(celda.col, celda.row, tipoSeleccionado);
  lastPaintCol = celda.col;
  lastPaintRow = celda.row;
});

canvas.addEventListener("mousemove", (e) => {
  if (panning) {
    cam.x = panStartCamX - (e.clientX - panStartX) / cam.zoom;
    cam.y = panStartCamY - (e.clientY - panStartY) / cam.zoom;
    clampCamera();
    return;
  }
  hoverCelda = pantallaACelda(e.clientX, e.clientY);
  if (!mouseDown) return;
  if (!hoverCelda) return;
  pintarLinea(lastPaintCol, lastPaintRow, hoverCelda.col, hoverCelda.row);
  lastPaintCol = hoverCelda.col;
  lastPaintRow = hoverCelda.row;
});
canvas.addEventListener("mouseleave", () => { hoverCelda = null; });

window.addEventListener("mouseup", (e) => {
  if (e.button === 1) panning = false;
  mouseDown = false;
  lastPaintCol = -1;
  lastPaintRow = -1;
});

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  cam.zoom = Math.max(cam.minZoom, Math.min(cam.maxZoom, cam.zoom * factor));
  const after = screenToWorld(e.clientX, e.clientY);
  cam.x += before.x - after.x;
  cam.y += before.y - after.y;
  clampCamera();
}, { passive: false });

function pintarLinea(c0, r0, c1, r1) {
  if (c1 < 0 || r1 < 0) return;
  if (c0 < 0 || r0 < 0) { pintarCelda(c1, r1, tipoSeleccionado); return; }
  let dc = Math.abs(c1 - c0), dr = Math.abs(r1 - r0);
  let sc = c0 < c1 ? 1 : -1, sr = r0 < r1 ? 1 : -1;
  let err = dc - dr, c = c0, r = r0;
  while (true) {
    pintarCelda(c, r, tipoSeleccionado);
    if (c === c1 && r === r1) break;
    const e2 = 2 * err;
    if (e2 > -dr) { err -= dr; c += sc; }
    if (e2 <  dc) { err += dc; r += sr; }
  }
}

/* =========================================================
   GRID
   ========================================================= */
const grid = [];
for (let r = 0; r < ROWS; r++) {
  const fila = [];
  for (let c = 0; c < COLS; c++) fila.push({ tipo: "vacio", asignada: false });
  grid.push(fila);
}

let gridDirty = true;

const gridCanvas = document.createElement("canvas");
gridCanvas.width  = GRID_W;
gridCanvas.height = GRID_H;
const gridCtx = gridCanvas.getContext("2d");

function celdaEsTransitable(col, row) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return false;
  return grid[row][col].tipo !== "muro";
}

function puntoEnMuro(x, y) {
  const col = Math.floor(x / TILE);
  const row = Math.floor(y / TILE);
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
  return grid[row][col].tipo === "muro";
}

const indiceCeldasPorTipo = new Map();

function reconstruirIndiceCeldas() {
  indiceCeldasPorTipo.clear();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tipo = grid[r][c].tipo;
      let arr = indiceCeldasPorTipo.get(tipo);
      if (!arr) { arr = []; indiceCeldasPorTipo.set(tipo, arr); }
      arr.push({ col: c, row: r });
    }
  }
}

function generarCarretera() {
  for (let r = CARRETERA_FILA_INICIO; r <= CARRETERA_FILA_FIN; r++) {
    for (let c = 0; c < COLS; c++) {
      grid[r][c].tipo = "carretera";
      grid[r][c].asignada = false;
    }
  }
}

function redibujarGridCache() {
  gridCtx.clearRect(0, 0, GRID_W, GRID_H);
  gridCtx.fillStyle = "#151526";
  gridCtx.fillRect(0, 0, GRID_W, GRID_H);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tipo = grid[r][c].tipo;
      const color = TIPOS_CELDA[tipo].color;
      if (color) {
        gridCtx.fillStyle = color;
        gridCtx.fillRect(c * TILE, r * TILE, TILE, TILE);
      }
      if (tipo === "celda" && grid[r][c].asignada) {
        gridCtx.fillStyle = "rgba(255,255,255,0.35)";
        gridCtx.beginPath();
        gridCtx.arc(c * TILE + TILE / 2, r * TILE + TILE / 2, 3, 0, Math.PI * 2);
        gridCtx.fill();
      }
    }
  }

  gridCtx.strokeStyle = "rgba(255,220,80,0.45)";
  gridCtx.lineWidth = 2;
  gridCtx.setLineDash([14, 14]);
  const yLinea = (CARRETERA_FILA_INICIO + 0.5) * TILE;
  gridCtx.beginPath();
  gridCtx.moveTo(0, yLinea);
  gridCtx.lineTo(GRID_W, yLinea);
  gridCtx.stroke();
  gridCtx.setLineDash([]);

  gridCtx.strokeStyle = "rgba(255,220,80,0.7)";
  gridCtx.lineWidth = 2;
  gridCtx.strokeRect(ENTREGA_X - TILE, CARRETERA_FILA_INICIO * TILE + 4,
                     TILE * 2, TILE * 3 - 8);

  gridCtx.strokeStyle = COLOR_GRID;
  gridCtx.lineWidth = 1;
  gridCtx.beginPath();
  for (let x = 0; x <= COLS; x++) {
    const px = x * TILE + 0.5;
    gridCtx.moveTo(px, 0); gridCtx.lineTo(px, GRID_H);
  }
  for (let y = 0; y <= ROWS; y++) {
    const py = y * TILE + 0.5;
    gridCtx.moveTo(0, py); gridCtx.lineTo(GRID_W, py);
  }
  gridCtx.stroke();

  gridCtx.strokeStyle = "rgba(255,255,255,0.18)";
  gridCtx.strokeRect(0.5, 0.5, GRID_W, GRID_H);

  reconstruirIndiceCeldas();
  gridDirty = false;
}

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const estadoGlobal = {
  dinero: 2500,
  dia: 1,
  tickDelDia: 0,
  pausado: true,
  mostrandoInstrucciones: true,
  resultado: null,
  finDePartida: false,
  motivoFin: "",
  motinesActuales: 0,
  ultimoDiaCerrado: 0,
  fugas: 0,
  tickGracia: 0
};

function puedeSimular() {
  return !estadoGlobal.pausado && !estadoGlobal.finDePartida && !estadoGlobal.mostrandoInstrucciones;
}
function franjaActual() {
  return Math.floor(estadoGlobal.tickDelDia / TICKS_POR_FRANJA);
}
function actividadActual() {
  const f = franjaActual();
  if (f < 0 || f >= FRANJAS_DIA) return "libre";
  return horario[f];
}
function tipoCeldaDeActividad(act) {
  if (act === "celda") return "celda";
  if (act === "comedor") return "comedor";
  if (act === "ducha") return "ducha";
  if (act === "patio") return "patio";
  return null;
}

/* =========================================================
   NPCs
   ========================================================= */
let nextNPCId = 1;
const npcs = [];
const presosEnMotin = [];
const camiones = [];

function crearPreso(x, y, celdaDestino) {
  return {
    id: nextNPCId++,
    tipo: "preso",
    x, y,
    angle: Math.random() * Math.PI * 2,
    speed: NPC_SPEEDS.preso,
    speedBase: NPC_SPEEDS.preso,
    color: NPC_COLORS.preso,
    hambre: 80 + Math.random() * 20,
    higiene: 80 + Math.random() * 20,
    libertad: 80 + Math.random() * 20,
    estado: "normal",
    objetivo: null,
    objetivoTipo: null,
    celdaAsignada: celdaDestino,
    recienLlegado: celdaDestino !== null,
    huyendo: false,
    cooldownLlegada: 0,
    cooldownAsignacion: 0,
    camino: [],
    pasoActual: 0,
    caminoDirty: true,
    actividadActual: null,
    /* OPT #1: cache de puedeHuir() */
    _huidaCache: undefined,

  };
}

function crearGuardia(x, y) {
  return {
    id: nextNPCId++, tipo: "guardia", x, y,
    angle: Math.random() * Math.PI * 2,
    speed: NPC_SPEEDS.guardia, speedBase: NPC_SPEEDS.guardia,
    color: NPC_COLORS.guardia,
    objetivo: null, presoObjetivo: null, detectoMotin: false,
    camino: [], pasoActual: 0, caminoDirty: true
  };
}

/* =========================================================
   PATHFINDING (A* + suavizado)
   ========================================================= */
class MinHeap {
  constructor() { this.heap = []; }
  push(node) {
    this.heap.push(node);
    let i = this.heap.length - 1;
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (this.heap[p].f <= this.heap[i].f) break;
      const tmp = this.heap[p]; this.heap[p] = this.heap[i]; this.heap[i] = tmp;
      i = p;
    }
  }
  pop() {
    if (this.heap.length === 0) return null;
    const top = this.heap[0];
    const last = this.heap.pop();
    if (this.heap.length > 0) {
      this.heap[0] = last;
      let i = 0;
      const n = this.heap.length;
      while (true) {
        let l = i * 2 + 1, r = i * 2 + 2, smallest = i;
        if (l < n && this.heap[l].f < this.heap[smallest].f) smallest = l;
        if (r < n && this.heap[r].f < this.heap[smallest].f) smallest = r;
        if (smallest === i) break;
        const tmp = this.heap[smallest]; this.heap[smallest] = this.heap[i]; this.heap[i] = tmp;
        i = smallest;
      }
    }
    return top;
  }
  get size() { return this.heap.length; }
}

const astar_g = new Float32Array(COLS * ROWS);
const astar_padre = new Int32Array(COLS * ROWS);
const astar_cerrado = new Uint8Array(COLS * ROWS);
const astar_stamp = new Uint32Array(COLS * ROWS);
let astarIteracion = 0;

function lineaDespejada(c0, r0, c1, r1) {
  let dc = Math.abs(c1 - c0);
  let dr = Math.abs(r1 - r0);
  let sc = c0 < c1 ? 1 : -1;
  let sr = r0 < r1 ? 1 : -1;
  let err = dc - dr;
  let c = c0, r = r0;
  while (true) {
    if (!celdaEsTransitable(c, r)) return false;
    if (c === c1 && r === r1) return true;
    const e2 = 2 * err;
    const diag = (e2 > -dr) && (e2 < dc);
    if (diag) {
      if (!celdaEsTransitable(c + sc, r)) return false;
      if (!celdaEsTransitable(c, r + sr)) return false;
      err -= dr; err += dc;
      c += sc; r += sr;
    } else if (e2 > -dr) {
      err -= dr; c += sc;
    } else if (e2 < dc) {
      err += dc; r += sr;
    }
  }
}

/* OPT #7: MAX_SALTO reducido a 8 y evitar suavizar caminos cortos */
function suavizarCamino(camino) {
  if (!camino || camino.length <= 4) return camino;
  const MAX_SALTO = 8;
  const resultado = [camino[0]];
  let i = 0;
  while (i < camino.length - 1) {
    let j = Math.min(i + MAX_SALTO, camino.length - 1);
    let mejor = i + 1;
    while (j > i + 1) {
      if (lineaDespejada(camino[i].col, camino[i].row, camino[j].col, camino[j].row)) {
        mejor = j;
        break;
      }
      j--;
    }
    resultado.push(camino[mejor]);
    i = mejor;
  }
  return resultado;
}

function astar(startCol, startRow, targetCol, targetRow) {
  if (startCol === targetCol && startRow === targetRow) return null;
  if (targetCol < 0 || targetRow < 0 || targetCol >= COLS || targetRow >= ROWS) return null;
  if (!celdaEsTransitable(targetCol, targetRow)) return null;
  if (startCol < 0 || startRow < 0 || startCol >= COLS || startRow >= ROWS) return null;

  astarIteracion++;
  const startIdx = startRow * COLS + startCol;
  const targetIdx = targetRow * COLS + targetCol;

  astar_stamp[startIdx] = astarIteracion;
  astar_stamp[targetIdx] = astarIteracion;
  astar_g[startIdx] = 0;
  astar_padre[startIdx] = -1;
  astar_cerrado[startIdx] = 0;

  const heap = new MinHeap();
  const h0 = Math.abs(startCol - targetCol) + Math.abs(startRow - targetRow);
  heap.push({ idx: startIdx, f: h0 });

  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];

  while (heap.size > 0) {
    const node = heap.pop();
    const idx = node.idx;
    if (astar_stamp[idx] === astarIteracion && astar_cerrado[idx]) continue;
    astar_cerrado[idx] = 1;

    if (idx === targetIdx) {
      const camino = [];
      let cur = idx;
      while (cur !== -1) {
        camino.push({ col: cur % COLS, row: (cur / COLS) | 0 });
        if (cur === startIdx) break;
        cur = astar_padre[cur];
      }
      camino.reverse();
      if (camino.length > 0 && camino[0].col === startCol && camino[0].row === startRow) camino.shift();
      return suavizarCamino(camino);
    }

    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const nc = col + dirs[d][0];
      const nr = row + dirs[d][1];
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      if (grid[nr][nc].tipo === "muro") continue;
      const nIdx = nr * COLS + nc;
      if (astar_stamp[nIdx] !== astarIteracion) {
        astar_stamp[nIdx] = astarIteracion;
        astar_g[nIdx] = Infinity;
        astar_padre[nIdx] = -1;
        astar_cerrado[nIdx] = 0;
      }
      if (astar_cerrado[nIdx]) continue;
      const ng = astar_g[idx] + 1;
      if (ng < astar_g[nIdx]) {
        astar_g[nIdx] = ng;
        astar_padre[nIdx] = idx;
        const h = Math.abs(nc - targetCol) + Math.abs(nr - targetRow);
        heap.push({ idx: nIdx, f: ng + h });
      }
    }
  }
  return null;
}

function bfsCamino(startCol, startRow, tipoBuscado, soloNoAsignadas, excluirCol, excluirRow) {
  if (startCol < 0 || startRow < 0 || startCol >= COLS || startRow >= ROWS) return null;

  const total = COLS * ROWS;
  const visitado = new Uint8Array(total);
  const padre = new Int32Array(total).fill(-1);
  const cola = new Int32Array(total);
  let head = 0, tail = 0;

  const startIdx = startRow * COLS + startCol;
  visitado[startIdx] = 1;
  cola[tail++] = startIdx;

  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  let destinoIdx = -1;

  while (head < tail) {
    const idx = cola[head++];
    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    const celda = grid[row][col];

    if (celda.tipo === tipoBuscado) {
      const esNoAsignada = !soloNoAsignadas || (tipoBuscado === "celda" ? !celda.asignada : true);
      const esDistinta = (col !== excluirCol || row !== excluirRow);
      if (esNoAsignada && esDistinta) {
        destinoIdx = idx;
        break;
      }
    }

    for (let d = 0; d < 4; d++) {
      const nc = col + dirs[d][0];
      const nr = row + dirs[d][1];
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const nIdx = nr * COLS + nc;
      if (visitado[nIdx]) continue;
      if (grid[nr][nc].tipo === "muro") continue;
      visitado[nIdx] = 1;
      padre[nIdx] = idx;
      cola[tail++] = nIdx;
    }
  }

  if (destinoIdx === -1) return null;

  const camino = [];
  let idx = destinoIdx;
  while (idx !== -1) {
    camino.push({ col: idx % COLS, row: (idx / COLS) | 0 });
    if (idx === startIdx) break;
    idx = padre[idx];
  }
  camino.reverse();
  if (camino.length > 0 && camino[0].col === startCol && camino[0].row === startRow) camino.shift();
  return suavizarCamino(camino);
}

/* OPT #2: BFS + reservoir sampling. Una sola pasada para
   elegir destino aleatorio alcanzable, y ya devuelve el camino.
   Reemplaza los 50 A* de la versión anterior. */
function bfsRandomReachablePath(startCol, startRow) {
  if (startCol < 0 || startRow < 0 || startCol >= COLS || startRow >= ROWS) return null;
  const total = COLS * ROWS;
  const visitado = new Uint8Array(total);
  const padre = new Int32Array(total).fill(-1);
  const cola = new Int32Array(total);
  let head = 0, tail = 0;
  const startIdx = startRow * COLS + startCol;
  visitado[startIdx] = 1;
  cola[tail++] = startIdx;
  let elegido = -1, contador = 0;

  while (head < tail) {
    const idx = cola[head++];
    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    if (!(col === startCol && row === startRow) && grid[row][col].tipo !== "carretera") {
      contador++;
      if (Math.random() < 1 / contador) elegido = idx;
    }
    if (col > 0) { const n = idx - 1; if (!visitado[n] && grid[row][col-1].tipo !== "muro") { visitado[n] = 1; padre[n] = idx; cola[tail++] = n; } }
    if (col < COLS - 1) { const n = idx + 1; if (!visitado[n] && grid[row][col+1].tipo !== "muro") { visitado[n] = 1; padre[n] = idx; cola[tail++] = n; } }
    if (row > 0) { const n = idx - COLS; if (!visitado[n] && grid[row-1][col].tipo !== "muro") { visitado[n] = 1; padre[n] = idx; cola[tail++] = n; } }
    if (row < ROWS - 1) { const n = idx + COLS; if (!visitado[n] && grid[row+1][col].tipo !== "muro") { visitado[n] = 1; padre[n] = idx; cola[tail++] = n; } }
  }

  if (elegido === -1) return null;

  const camino = [];
  let idx = elegido;
  while (idx !== -1) {
    camino.push({ col: idx % COLS, row: (idx / COLS) | 0 });
    if (idx === startIdx) break;
    idx = padre[idx];
  }
  camino.reverse();
  if (camino.length > 0 && camino[0].col === startCol && camino[0].row === startRow) camino.shift();
  return suavizarCamino(camino);
}

/* OPT #1: BFS que retorna true en cuanto toca cualquier borde.
   Reemplaza las ~200 llamadas a A* de puedeHuir() antiguo. */
function bfsAlcanzaBorde(startCol, startRow) {
  if (startCol <= 0 || startRow <= 0 || startCol >= COLS - 1 || startRow >= ROWS - 1) return true;
  const total = COLS * ROWS;
  const visitado = new Uint8Array(total);
  const cola = new Int32Array(total);
  let head = 0, tail = 0;
  const startIdx = startRow * COLS + startCol;
  visitado[startIdx] = 1;
  cola[tail++] = startIdx;

  while (head < tail) {
    const idx = cola[head++];
    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    if (col === 0 || row === 0 || col === COLS - 1 || row === ROWS - 1) return true;

    if (col > 0) { const n = idx - 1; if (!visitado[n] && grid[row][col-1].tipo !== "muro") { visitado[n] = 1; cola[tail++] = n; } }
    if (col < COLS - 1) { const n = idx + 1; if (!visitado[n] && grid[row][col+1].tipo !== "muro") { visitado[n] = 1; cola[tail++] = n; } }
    if (row > 0) { const n = idx - COLS; if (!visitado[n] && grid[row-1][col].tipo !== "muro") { visitado[n] = 1; cola[tail++] = n; } }
    if (row < ROWS - 1) { const n = idx + COLS; if (!visitado[n] && grid[row+1][col].tipo !== "muro") { visitado[n] = 1; cola[tail++] = n; } }
  }
  return false;
}

function celdaDePunto(x, y) {
  return {
    col: Math.max(0, Math.min(COLS - 1, Math.floor(x / TILE))),
    row: Math.max(0, Math.min(ROWS - 1, Math.floor(y / TILE)))
  };
}

/* =========================================================
   ASIGNACIÓN DE CAMINO
   ========================================================= */
function asignarCamino(npc, tipoBuscado, motivo, soloNoAsignadas) {
  const p = celdaDePunto(npc.x, npc.y);
  const camino = bfsCamino(p.col, p.row, tipoBuscado, soloNoAsignadas, p.col, p.row);
  if (!camino || camino.length === 0) return false;
  npc.camino = camino;
  npc.pasoActual = 0;
  npc.objetivo = motivo;
  npc.objetivoTipo = tipoBuscado;
  npc.caminoDirty = false;
  return true;
}

/* OPT #3: un solo BFS en vez de 8 intentos de A*. */
function asignarCaminoAleatorio(npc, tipoCelda, motivo) {
  const p = celdaDePunto(npc.x, npc.y);
  const camino = bfsCamino(p.col, p.row, tipoCelda, false, p.col, p.row);
  if (!camino || camino.length === 0) return false;
  npc.camino = camino;
  npc.pasoActual = 0;
  npc.objetivo = motivo;
  npc.objetivoTipo = tipoCelda;
  npc.caminoDirty = false;
  return true;
}

function asignarCeldaAPreso(preso) {
  const p = celdaDePunto(preso.x, preso.y);
  const camino = bfsCamino(p.col, p.row, "celda", true, p.col, p.row);
  if (camino && camino.length > 0) {
    const destino = camino[camino.length - 1];
    grid[destino.row][destino.col].asignada = true;
    preso.celdaAsignada = destino;
    preso.recienLlegado = true;
    preso.camino = camino;
    preso.pasoActual = 0;
    preso.objetivo = "celda";
    preso.objetivoTipo = "celda";
    preso.caminoDirty = false;
    return true;
  }
  preso.celdaAsignada = null;
  preso.recienLlegado = false;
  return false;
}

/* =========================================================
   NECESIDADES
   ========================================================= */
function resolverLlegada(npc) {
  if (npc.tipo !== "preso") return;
  if (npc.objetivo === "comedor") npc.hambre = 100;
  else if (npc.objetivo === "ducha") npc.higiene = 100;
  else if (npc.objetivo === "celda") {
    npc.libertad = Math.min(100, npc.libertad + LIBERTAD_AL_DESCANSAR);
    if (npc.recienLlegado) npc.recienLlegado = false;
  }
  npc.objetivo = null;
  npc.objetivoTipo = null;
  npc.camino = [];
  npc.pasoActual = 0;
  npc.cooldownLlegada = 2;
  npc.actividadActual = null;
}

/* =========================================================
   HUIDA
   ========================================================= */
/* OPT #1: cache por mapVersion + BFS multiobjetivo que corta
   al tocar cualquier borde. Antes esto era ~200 A* por preso
   por tick → ahora es 1 BFS por preso y solo si el mapa cambió. */
function puedeHuir(preso) {
  if (estadoGlobal.tickGracia < GRACIA_HUIDA_TICKS) return false;
  if (preso.recienLlegado) return false;
  if (!preso.celdaAsignada) return false;
  const ca = preso.celdaAsignada;
  if (grid[ca.row][ca.col].tipo !== "celda") return false;

  if (preso._huidaCache !== undefined && preso._huidaCacheMapVersion === mapVersion) {
    return preso._huidaCache;
  }

  const p = celdaDePunto(preso.x, preso.y);
  const resultado = bfsAlcanzaBorde(p.col, p.row);
  preso._huidaCache = resultado;
  preso._huidaCacheMapVersion = mapVersion;
  return resultado;
}

function iniciarHuida(preso) {
  const bordes = [];
  for (let c = 0; c < COLS; c++) { bordes.push({col:c,row:0}); bordes.push({col:c,row:ROWS-1}); }
  for (let r = 0; r < ROWS; r++) { bordes.push({col:0,row:r}); bordes.push({col:COLS-1,row:r}); }
  const p = celdaDePunto(preso.x, preso.y);
  let mejorCamino = null;
  for (let i = 0; i < bordes.length; i++) {
    const b = bordes[i];
    if (grid[b.row][b.col].tipo === "muro") continue;
    const camino = astar(p.col, p.row, b.col, b.row);
    if (camino && camino.length > 0) {
      if (!mejorCamino || camino.length < mejorCamino.length) mejorCamino = camino;
    }
  }
  if (!mejorCamino || mejorCamino.length === 0) return false;
  preso.huyendo = true;
  preso.estado = "huyendo";
  preso.speed = preso.speedBase * SPEED_INQUIETO;
  preso.camino = mejorCamino;
  preso.pasoActual = 0;
  preso.objetivo = "escapar";
  preso.objetivoTipo = "borde";
  preso.caminoDirty = false;
  return true;
}

function registrarFuga(preso) {
  const idx = npcs.indexOf(preso);
  if (idx >= 0) npcs.splice(idx, 1);
  if (preso.celdaAsignada) {
    grid[preso.celdaAsignada.row][preso.celdaAsignada.col].asignada = false;
    gridDirty = true;
  }
  estadoGlobal.fugas++;
  if (estadoGlobal.fugas >= FUGAS_MAX && !estadoGlobal.finDePartida) {
    finalizarPartida("derrota", "Demasiadas fugas: " + estadoGlobal.fugas);
  }
}

/* =========================================================
   OBJETIVO SEGÚN HORARIO
   ========================================================= */
function asignarObjetivoPorHorario(preso) {
  const act = actividadActual();
  if (act === "libre") return false;

  if (act === "celda") {
    if (!preso.celdaAsignada) return false;
    const ca = preso.celdaAsignada;
    if (grid[ca.row][ca.col].tipo !== "celda") return false;
    const p = celdaDePunto(preso.x, preso.y);
    if (p.col === ca.col && p.row === ca.row) { preso.actividadActual = "celda"; return true; }
    const camino = astar(p.col, p.row, ca.col, ca.row);
    if (camino && camino.length > 0) {
      preso.camino = camino;
      preso.pasoActual = 0;
      preso.objetivo = "celda";
      preso.objetivoTipo = "celda";
      preso.actividadActual = "celda";
      preso.caminoDirty = false;
      return true;
    }
    return false;
  }

  const tipo = tipoCeldaDeActividad(act);
  if (!tipo) return false;
  const p = celdaDePunto(preso.x, preso.y);
  if (grid[p.row][p.col].tipo === tipo) {
    preso.actividadActual = act;
    if (tipo === "comedor") preso.hambre = 100;
    else if (tipo === "ducha") preso.higiene = 100;
    else if (tipo === "patio") preso.libertad = Math.min(100, preso.libertad + 1);
    return true;
  }
  if (asignarCamino(preso, tipo, tipo, false)) { preso.actividadActual = act; return true; }
  return false;
}

/* =========================================================
   TICK DE PRESO
   ========================================================= */
function tickPreso(preso) {
  if (preso.huyendo) {
    if (preso.camino.length === 0) registrarFuga(preso);
    return;
  }

  if (preso.celdaAsignada) {
    const c = preso.celdaAsignada.col, r = preso.celdaAsignada.row;
    if (grid[r][c].tipo !== "celda") {
      preso.celdaAsignada = null;
      preso.recienLlegado = false;
      preso.objetivo = null;
      preso.objetivoTipo = null;
      preso.camino = [];
      preso.caminoDirty = true;
    }
  }

  if (!preso.celdaAsignada && !preso.recienLlegado) {
    preso.hambre   = Math.max(0, preso.hambre   - DECAIMIENTO_HAMBRE);
    preso.higiene  = Math.max(0, preso.higiene  - DECAIMIENTO_HIGIENE);
    preso.libertad = Math.max(0, preso.libertad - DECAIMIENTO_LIBERTAD);
    if (preso.libertad <= 0) preso.estado = "motin";
    else if (preso.libertad < 20) preso.estado = "inquieto";
    else preso.estado = "normal";

    preso.cooldownAsignacion--;
    if (preso.cooldownAsignacion <= 0) {
      preso.cooldownAsignacion = 20;
      asignarCeldaAPreso(preso);
    }
    return;
  }

  if (preso.recienLlegado && preso.celdaAsignada) {
    if (preso.caminoDirty) {
      const p = celdaDePunto(preso.x, preso.y);
      const camino = astar(p.col, p.row, preso.celdaAsignada.col, preso.celdaAsignada.row);
      if (camino) {
        preso.camino = camino;
        preso.pasoActual = 0;
        preso.objetivo = "celda";
        preso.caminoDirty = false;
      }
    }
    if (preso.camino.length === 0) resolverLlegada(preso);
    return;
  }

  preso.hambre   = Math.max(0, preso.hambre   - DECAIMIENTO_HAMBRE);
  preso.higiene  = Math.max(0, preso.higiene  - DECAIMIENTO_HIGIENE);
  preso.libertad = Math.max(0, preso.libertad - DECAIMIENTO_LIBERTAD);

  if (preso.libertad <= 0) preso.estado = "motin";
  else if (preso.libertad < 20) preso.estado = "inquieto";
  else preso.estado = "normal";

  if (preso.estado === "inquieto" || preso.estado === "motin") {
    preso.speed = preso.speedBase * SPEED_INQUIETO;
  } else {
    preso.speed = preso.speedBase;
  }

  if (puedeHuir(preso) && Math.random() < PROB_HUIDA) {
    iniciarHuida(preso);
    return;
  }

  if (preso.estado === "motin") {
    if (preso.camino.length === 0) {
      if (!asignarCaminoAleatorio(preso, "patio", "patio")) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    }
    return;
  }

  if (preso.objetivo && preso.camino.length === 0) resolverLlegada(preso);
  if (preso.cooldownLlegada > 0) { preso.cooldownLlegada--; return; }

  if (preso.camino.length === 0 && !preso.objetivo) {
    const act = actividadActual();
    if (act !== "libre") {
      const p = celdaDePunto(preso.x, preso.y);
      const tipoEsperado = tipoCeldaDeActividad(act);

      if (tipoEsperado && grid[p.row][p.col].tipo === tipoEsperado) {
        if (tipoEsperado === "comedor") preso.hambre = 100;
        else if (tipoEsperado === "ducha") preso.higiene = 100;
        else if (tipoEsperado === "patio") preso.libertad = Math.min(100, preso.libertad + 1);
        else if (tipoEsperado === "celda") {
          if (preso.celdaAsignada &&
              (p.col !== preso.celdaAsignada.col || p.row !== preso.celdaAsignada.row)) {
            const camino = astar(p.col, p.row, preso.celdaAsignada.col, preso.celdaAsignada.row);
            if (camino && camino.length > 0) {
              preso.camino = camino;
              preso.pasoActual = 0;
              preso.objetivo = "celda";
              preso.objetivoTipo = "celda";
              preso.actividadActual = "celda";
              preso.caminoDirty = false;
            }
          } else {
            preso.libertad = Math.min(100, preso.libertad + LIBERTAD_AL_DESCANSAR);
          }
        }
        preso.actividadActual = act;
        return;
      }
      if (asignarObjetivoPorHorario(preso)) return;
    }
  }

  if (!preso.objetivo && preso.camino.length === 0) {
    if (preso.libertad < LIBERTAD_PARA_CELDA && preso.celdaAsignada) {
      const p = celdaDePunto(preso.x, preso.y);
      const camino = astar(p.col, p.row, preso.celdaAsignada.col, preso.celdaAsignada.row);
      if (camino && camino.length > 0) {
        preso.camino = camino;
        preso.pasoActual = 0;
        preso.objetivo = "celda";
        preso.objetivoTipo = "celda";
        return;
      }
    }
    if (preso.hambre < 30) {
      if (!asignarCamino(preso, "comedor", "comedor", false)) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    } else if (preso.higiene < 30) {
      if (!asignarCamino(preso, "ducha", "ducha", false)) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    } else {
      if (!asignarCaminoAleatorio(preso, "patio", "patio")) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    }
  }
}

/* =========================================================
   GUARDIAS
   ========================================================= */
const DIST_DETECTAR_MOTIN = 80;
const DIST_CALMAR        = 18;

function presoEnMotinMasCercano(guardia) {
  let mejor = null, mejorDist = Infinity;
  const gx = guardia.x, gy = guardia.y;
  for (let i = 0; i < presosEnMotin.length; i++) {
    const n = presosEnMotin[i];
    const dx = n.x - gx, dy = n.y - gy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < mejorDist) { mejorDist = d; mejor = n; }
  }
  return mejor;
}

function presoHuyendoMasCercano(guardia) {
  let mejor = null, mejorDist = Infinity;
  const gx = guardia.x, gy = guardia.y;
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.tipo !== "preso" || !n.huyendo) continue;
    const dx = n.x - gx, dy = n.y - gy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < mejorDist) { mejorDist = d; mejor = n; }
  }
  return mejor;
}

/* OPT #2: una sola BFS con reservoir sampling en vez de 50 A*. */
function patrullar(guardia) {
  const p = celdaDePunto(guardia.x, guardia.y);
  const camino = bfsRandomReachablePath(p.col, p.row);
  if (camino && camino.length > 0) {
    guardia.camino = camino;
    guardia.pasoActual = 0;
    guardia.objetivo = "patrulla";
    guardia.caminoDirty = false;
  }
}

function tickGuardia(guardia) {
  guardia.detectoMotin = false;

  if (guardia.camino.length > 0 && guardia.pasoActual < guardia.camino.length) {
    const paso = guardia.camino[guardia.pasoActual];
    if (grid[paso.row][paso.col].tipo === "muro") {
      guardia.camino = [];
      guardia.caminoDirty = true;
    }
  }

  const huidizo = presoHuyendoMasCercano(guardia);
  if (huidizo) {
    const dx = huidizo.x - guardia.x, dy = huidizo.y - guardia.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < DIST_DETECTAR_MOTIN) {
      const p = celdaDePunto(guardia.x, guardia.y);
      const ph = celdaDePunto(huidizo.x, huidizo.y);
      const camino = astar(p.col, p.row, ph.col, ph.row);
      if (camino) { guardia.camino = camino; guardia.pasoActual = 0; }
      guardia.objetivo = "perseguir";
      guardia.presoObjetivo = huidizo;
      if (d < DIST_CALMAR) {
        huidizo.huyendo = false;
        huidizo.estado = "normal";
        huidizo.libertad = 50;
        huidizo.speed = huidizo.speedBase;
        huidizo.objetivo = null;
        huidizo.objetivoTipo = null;
        huidizo.camino = [];
        guardia.objetivo = "patrulla";
        guardia.presoObjetivo = null;
        guardia.camino = [];
      }
      return;
    }
  }

  const motin = presoEnMotinMasCercano(guardia);
  if (motin) {
    const dx = motin.x - guardia.x, dy = motin.y - guardia.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < DIST_DETECTAR_MOTIN) {
      guardia.detectoMotin = true;
      const p = celdaDePunto(guardia.x, guardia.y);
      const pm = celdaDePunto(motin.x, motin.y);
      const camino = astar(p.col, p.row, pm.col, pm.row);
      if (camino) { guardia.camino = camino; guardia.pasoActual = 0; }
      guardia.objetivo = "perseguir";
      guardia.presoObjetivo = motin;
      if (d < DIST_CALMAR) {
        motin.estado = "normal";
        motin.libertad = 50;
        motin.speed = motin.speedBase;
        motin.objetivo = null;
        motin.objetivoTipo = null;
        motin.camino = [];
        guardia.objetivo = "patrulla";
        guardia.presoObjetivo = null;
        guardia.camino = [];
      }
      return;
    }
  }

  if (guardia.objetivo !== "patrulla" || guardia.camino.length === 0) {
    guardia.presoObjetivo = null;
    patrullar(guardia);
  }
}

/* =========================================================
   CAMIONES DE ENTREGA
   ========================================================= */
function crearCamion(numPresos) {
  return {
    x: -CAMION_ANCHO - 40,
    y: CARRETERA_Y,
    velocidad: CAMION_VELOCIDAD,
    objetivoX: ENTREGA_X,
    estado: "llegando",
    timer: 0,
    siguienteSpawn: 1.0,
    presosTotales: numPresos,
    presosSpawned: 0,
    ancho: CAMION_ANCHO,
    alto: CAMION_ALTO
  };
}

function actualizarCamion(camion, dt) {
  if (camion.estado === "llegando") {
    camion.x += camion.velocidad * dt;
    if (camion.x >= camion.objetivoX) {
      camion.x = camion.objetivoX;
      camion.estado = "parado";
      camion.timer = 0;
      camion.siguienteSpawn = 1.0;
    }
  } else if (camion.estado === "parado") {
    camion.timer += dt;
    while (camion.presosSpawned < camion.presosTotales && camion.timer >= camion.siguienteSpawn) {
      const preso = crearPreso(camion.x, camion.y + 20, null);
      asignarCeldaAPreso(preso);
      npcs.push(preso);
      camion.presosSpawned++;
      camion.siguienteSpawn += CAMION_INTERVALO_PRESO;
    }
    if (camion.presosSpawned >= camion.presosTotales &&
        camion.timer >= camion.siguienteSpawn + CAMION_PAUSA_POST) {
      camion.estado = "saliendo";
    }
  } else if (camion.estado === "saliendo") {
    camion.x += camion.velocidad * dt;
  }
}

function dibujarCamion(camion) {
  const x = camion.x, y = camion.y;
  const w = camion.ancho, h = camion.alto;
  ctx.beginPath();
  ctx.ellipse(x, y + h / 2, w / 2 + 4, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fill();
  ctx.fillStyle = "#6b4c2a";
  ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.fillStyle = "#8a6640";
  ctx.fillRect(x + w / 2 - 24, y - h / 2 - 6, 24, h + 6);
  ctx.fillStyle = "#a8d4ff";
  ctx.fillRect(x + w / 2 - 21, y - h / 2 - 2, 16, h / 2 - 2);
  ctx.fillStyle = "#3a3a3a";
  ctx.fillRect(x - w / 2 + 8, y - h / 2 + 6, 6, h - 12);
  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath(); ctx.arc(x - w / 2 + 16, y + h / 2, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w / 2 - 16, y + h / 2, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x - w / 2 + 16, y + h / 2, 3, 0, Math.PI * 2); ctx.fillStyle = "#666"; ctx.fill();
  ctx.beginPath(); ctx.arc(x + w / 2 - 16, y + h / 2, 3, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x - w / 2, y - h / 2, w, h);
}

/* =========================================================
   DIBUJO NPCs
   ========================================================= */
const cacheRgba = new Map();
function hexToRgba(hex, alpha) {
  const clave = hex + "_" + alpha;
  let val = cacheRgba.get(clave);
  if (val !== undefined) return val;
  if (cacheRgba.size >= 64) cacheRgba.clear();
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  val = "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  cacheRgba.set(clave, val);
  return val;
}

function dibujarNPC(npc, tiempoMs) {
  const sx = npc.x, sy = npc.y;
  ctx.beginPath();
  ctx.ellipse(sx, sy + NPC_RADIUS * 0.9, NPC_RADIUS * 1.2, NPC_RADIUS * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fill();

  let colorCono = npc.color;
  if (npc.tipo === "preso") {
    if (npc.huyendo) colorCono = "#ffff00";
    else if (npc.estado === "inquieto") colorCono = "#ff8800";
    else if (npc.estado === "motin") colorCono = "#ff0000";
  } else if (npc.tipo === "guardia" && npc.detectoMotin) {
    colorCono = "#ff6666";
  }

  const a1 = npc.angle - VISION_FOV / 2;
  const a2 = npc.angle + VISION_FOV / 2;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + Math.cos(a1) * VISION_RADIUS, sy + Math.sin(a1) * VISION_RADIUS);
  ctx.lineTo(sx + Math.cos(a2) * VISION_RADIUS, sy + Math.sin(a2) * VISION_RADIUS);
  ctx.closePath();
  ctx.fillStyle = hexToRgba(colorCono, VISION_ALPHA);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, NPC_RADIUS, 0, Math.PI * 2);
  if (npc.tipo === "preso" && npc.huyendo) {
    const pulso = 0.5 + 0.5 * Math.sin(tiempoMs * 0.012);
    ctx.fillStyle = "rgb(255," + Math.floor(200 + 55 * pulso) + ",0)";
  } else if (npc.tipo === "preso" && npc.estado === "motin") {
    const pulso = 0.5 + 0.5 * Math.sin(tiempoMs * 0.008);
    ctx.fillStyle = "rgb(255," + Math.floor(60 + 120 * pulso) + "," + Math.floor(60 + 40 * pulso) + ")";
  } else {
    ctx.fillStyle = npc.color;
  }
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();
}

function posAleatoriaTransitable() {
  const tipos = ["vacio", "celda", "comedor", "ducha", "patio"];
  const candidatos = [];
  for (let t = 0; t < tipos.length; t++) {
    const arr = indiceCeldasPorTipo.get(tipos[t]);
    if (arr) for (let i = 0; i < arr.length; i++) candidatos.push(arr[i]);
  }
  if (candidatos.length > 0) {
    const d = candidatos[Math.floor(Math.random() * candidatos.length)];
    return { x: d.col * TILE + TILE / 2, y: d.row * TILE + TILE / 2 };
  }
  return { x: TILE * 10, y: TILE * 8 };
}

function poblarMundo() {
  generarCarretera();
  reconstruirIndiceCeldas();
  mapVersion++;
  for (let i = 0; i < 2; i++) {
    const p = posAleatoriaTransitable();
    npcs.push(crearGuardia(p.x, p.y));
  }
  camiones.push(crearCamion(PRESOS_ENTREGA_INICIAL));
}

/* =========================================================
   MOVIMIENTO
   ========================================================= */
function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + diff * t;
}

function actualizarMovimiento(npc, dt) {
  if (npc.camino.length === 0 || npc.pasoActual >= npc.camino.length) {
    npc.angle += 0.01;
    return;
  }
  const paso = npc.camino[npc.pasoActual];
  const targetX = paso.col * TILE + TILE / 2;
  const targetY = paso.row * TILE + TILE / 2;
  const dx = targetX - npc.x, dy = targetY - npc.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 6) {
    npc.pasoActual++;
    if (npc.pasoActual >= npc.camino.length) {
      npc.camino = [];
      npc.pasoActual = 0;
      if (npc.tipo === "preso") resolverLlegada(npc);
    }
    return;
  }
  const dirDeseada = Math.atan2(dy, dx);
  const t = Math.min(1, dt * 10);
  npc.angle = lerpAngle(npc.angle, dirDeseada, t);
  const step = npc.speed * dt;
  const pasoMin = Math.min(step, dist);
  const nx = npc.x + Math.cos(dirDeseada) * pasoMin;
  const ny = npc.y + Math.sin(dirDeseada) * pasoMin;
  if (!puntoEnMuro(nx, ny)) { npc.x = nx; npc.y = ny; }
}

/* =========================================================
   ECONOMÍA
   ========================================================= */
const INGRESO_POR_PRESO = 20;
const GASTO_POR_GUARDIA = 15;

function contarTipo(tipo) {
  let n = 0;
  for (let i = 0; i < npcs.length; i++) if (npcs[i].tipo === tipo) n++;
  return n;
}

function cerrarDia() {
  if (estadoGlobal.dia === estadoGlobal.ultimoDiaCerrado) return;
  const presos   = contarTipo("preso");
  const guardias = contarTipo("guardia");
  estadoGlobal.dinero += presos * INGRESO_POR_PRESO;
  estadoGlobal.dinero -= guardias * GASTO_POR_GUARDIA;
  if (estadoGlobal.dinero < 0) {
    estadoGlobal.dinero = 0;
    finalizarPartida("derrota", "Te quedaste sin dinero");
    estadoGlobal.ultimoDiaCerrado = estadoGlobal.dia;
    return;
  }
  estadoGlobal.dia++;
  estadoGlobal.tickDelDia = 0;
  if (estadoGlobal.dia > DIA_VICTORIA) {
    const presosFinal = contarTipo("preso");
    if (presosFinal >= PRESOS_PARA_GANAR) finalizarPartida("victoria", "¡Has construido una prisión exitosa!");
    else if (presosFinal < PRESOS_MINIMOS) finalizarPartida("derrota", "Muy pocos presos al final del día " + DIA_VICTORIA);
    else finalizarPartida("derrota", "No llegaste a " + PRESOS_PARA_GANAR + " presos");
  } else {
    camiones.push(crearCamion(PRESOS_ENTREGA_DIARIA));
  }
  estadoGlobal.ultimoDiaCerrado = estadoGlobal.dia - 1;
}

function finalizarPartida(resultado, motivo) {
  if (estadoGlobal.finDePartida) return;
  estadoGlobal.finDePartida = true;
  estadoGlobal.pausado = true;
  estadoGlobal.resultado = resultado;
  estadoGlobal.motivoFin = motivo;
}

function comprobarMotines() {
  let motines = 0;
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.tipo === "preso" && n.estado === "motin") motines++;
  }
  estadoGlobal.motinesActuales = motines;
  if (motines >= MOTINES_MAX && !estadoGlobal.finDePartida) {
    finalizarPartida("derrota", "Motín general: " + motines + " presos en motín");
  }
}

/* =========================================================
   TICK
   ========================================================= */
let lastTick = performance.now();

function tick() {
  if (!puedeSimular()) return;
  if (estadoGlobal.tickGracia < GRACIA_HUIDA_TICKS) estadoGlobal.tickGracia++;
  estadoGlobal.tickDelDia++;
  if (estadoGlobal.tickDelDia >= TICKS_POR_DIA) {
    cerrarDia();
    if (estadoGlobal.finDePartida) return;
  }
  presosEnMotin.length = 0;
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.tipo === "preso" && n.estado === "motin") presosEnMotin.push(n);
  }
  const snapshot = npcs.slice();
  for (let i = 0; i < snapshot.length; i++) {
    const npc = snapshot[i];
    if (npc.tipo === "preso") tickPreso(npc);
    else if (npc.tipo === "guardia") tickGuardia(npc);
  }
  comprobarMotines();
}

/* =========================================================
   HORA Y FASE
   ========================================================= */
/* OPT #8: cache de faseDelDia por tick. Se llama 2 veces
   por frame y antes alocaba 2 strings rgba() cada frame. */
let _faseCache = null;
let _faseCacheTick = -1;
function faseDelDia() {
  if (_faseCacheTick === estadoGlobal.tickDelDia && _faseCache) return _faseCache;
  const p = estadoGlobal.tickDelDia / TICKS_POR_DIA;
  let a, b, t;
  if (p < 0.25)      { a = FASE_AMANECER; b = FASE_MEDIODIA; t = p / 0.25; }
  else if (p < 0.5)  { a = FASE_MEDIODIA; b = FASE_TARDE;    t = (p - 0.25) / 0.25; }
  else if (p < 0.75) { a = FASE_TARDE;    b = FASE_NOCHE;    t = (p - 0.5) / 0.25; }
  else               { a = FASE_NOCHE;    b = FASE_AMANECER; t = (p - 0.75) / 0.25; }
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  const alpha = a.a + (b.a - a.a) * t;
  let nombre;
  if (p < 0.20) nombre = "Amanecer";
  else if (p < 0.45) nombre = "Mediodía";
  else if (p < 0.70) nombre = "Atardecer";
  else nombre = "Noche";
  _faseCache = { nombre, tinte: "rgba(" + r + "," + g + "," + bl + "," + alpha.toFixed(3) + ")" };
  _faseCacheTick = estadoGlobal.tickDelDia;
  return _faseCache;
}

function dosDigitos(n) { return n < 10 ? "0" + n : "" + n; }
function horaDelDia() {
  const minutos = Math.floor((estadoGlobal.tickDelDia / TICKS_POR_DIA) * MINUTOS_POR_DIA);
  const hh = Math.floor(minutos / 60) % 24;
  const mm = minutos % 60;
  return dosDigitos(hh) + ":" + dosDigitos(mm);
}
function horaDeFranja(franja) {
  const minutos = Math.floor((franja / FRANJAS_DIA) * MINUTOS_POR_DIA);
  const hh = Math.floor(minutos / 60) % 24;
  const mm = minutos % 60;
  return dosDigitos(hh) + ":" + dosDigitos(mm);
}

  ctx.font = font; ctx.textBaseline = "top";
  const colNombreAncho = 90, colDescAncho = 90;
  let maxW = ctx.measureText("GUÍA DE COLORES").width;
  const filas = [];
  filas.push({ tipo: "titulo", txt: "CONTROLES" });
  for (let i = 0; i < CONTROLES.length; i++) {
    const w = ctx.measureText(CONTROLES[i][0] + "  " + CONTROLES[i][1]).width;
    if (w > maxW) maxW = w;
    filas.push({ tipo: "control", key: CONTROLES[i][0], val: CONTROLES[i][1] });
  }
  filas.push({ tipo: "espacio" });
  filas.push({ tipo: "titulo", txt: "GUÍA DE COLORES" });
  filas.push({ tipo: "subtitulo", txt: "Celdas" });
  for (let i = 0; i < GUIA_CELDAS.length; i++) {
    const w = ctx.measureText(GUIA_CELDAS[i][0]).width + 16 + colDescAncho;
    if (w > maxW) maxW = w;
    filas.push({ tipo: "color", nombre: GUIA_CELDAS[i][0], color: GUIA_CELDAS[i][1], desc: GUIA_CELDAS[i][2] });
  }
  filas.push({ tipo: "subtitulo", txt: "NPCs" });
  for (let i = 0; i < GUIA_NPCS.length; i++) {
    const w = ctx.measureText(GUIA_NPCS[i][0]).width + 16 + colDescAncho;
    if (w > maxW) maxW = w;
    filas.push({ tipo: "color", nombre: GUIA_NPCS[i][0], color: GUIA_NPCS[i][1], desc: GUIA_NPCS[i][2] });
  }
  filas.push({ tipo: "subtitulo", txt: "Estados" });
  for (let i = 0; i < GUIA_ESTADOS.length; i++) {
    const w = ctx.measureText(GUIA_ESTADOS[i][0]).width + 16 + colDescAncho;
    if (w > maxW) maxW = w;
    filas.push({ tipo: "color", nombre: GUIA_ESTADOS[i][0], color: GUIA_ESTADOS[i][1], desc: GUIA_ESTADOS[i][2] });
  }
  const panelW = maxW + pad * 2;
  const panelH = pad * 2 + filas.length * lineH + 20;
  const x = window.innerWidth - panelW - 12;
  const y = window.innerHeight - panelH - 12;
  ctx.fillStyle = "rgba(0,0,0,0.72)";
  ctx.fillRect(x, y, panelW, panelH);
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, panelW, panelH);
  let cy = y + pad;
  for (let i = 0; i < filas.length; i++) {
    const f = filas[i];
    if (f.tipo === "titulo") {
      ctx.fillStyle = "#ffcc44"; ctx.font = "bold " + font;
      ctx.fillText(f.txt, x + pad, cy); cy += lineH + 4;
    } else if (f.tipo === "subtitulo") {
      ctx.fillStyle = "#aaa"; ctx.font = font;
      ctx.fillText(f.txt, x + pad, cy); cy += lineH;
    } else if (f.tipo === "control") {
      ctx.fillStyle = "#7dcfff"; ctx.font = font;
      ctx.fillText(f.key, x + pad, cy);
      ctx.fillStyle = "#e0e0e0";
      ctx.fillText(f.val, x + pad + 70, cy); cy += lineH;
    } else if (f.tipo === "color") {
      ctx.fillStyle = f.color;
      ctx.fillRect(x + pad, cy + 2, 10, 10);
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + pad + 0.5, cy + 2.5, 10, 10);
      ctx.fillStyle = "#e0e0e0"; ctx.font = font;
      ctx.fillText(f.nombre, x + pad + 16, cy);
      ctx.fillStyle = "#888";
      ctx.fillText(f.desc, x + pad + 16 + colNombreAncho, cy); cy += lineH;
    } else if (f.tipo === "espacio") cy += seccionH;
  }
}

/* =========================================================
   WORD-WRAP + INSTRUCCIONES
   ========================================================= */
function wrapText(texto, maxAncho) {
  const palabras = texto.split(" ");
  const lineas = [];
  let lineaActual = "";
  for (let i = 0; i < palabras.length; i++) {
    const prueba = lineaActual === "" ? palabras[i] : lineaActual + " " + palabras[i];
    if (ctx.measureText(prueba).width <= maxAncho) lineaActual = prueba;
    else { if (lineaActual !== "") lineas.push(lineaActual); lineaActual = palabras[i]; }
  }
  if (lineaActual !== "") lineas.push(lineaActual);
  return lineas;
}

const INSTRUCCIONES = [
  { titulo: "OBJETIVO", lineas: [

    "Los presos llegan en camión por la carretera.",
    "Pierdes si: te quedas sin dinero, hay 3 motines, o 3 fugas."

  { titulo: "CÁMARA Y CONSTRUIR", lineas: [
    "WASD/Flechas: mover cámara. Rueda: zoom. Clic medio: arrastrar.",
    "1-6 elige tipo. Clic izquierdo pinta y arrastra.",
    "Muro bloquea. Celda asigna preso. Comedor/Ducha/Patio cubren necesidades."
  ]},
  { titulo: "ENTREGAS", lineas: [
    "El camión entra por la carretera inferior y deja presos.",
    "Los presos NO deambulan hasta llegar a su celda asignada.",
    "Si no hay celdas libres, esperan en la carretera. ¡Constrúyelas!"
  ]},
  { titulo: "HORARIO", lineas: [
    "Panel superior izquierdo: 6 franjas del día.",
    "Clic en una franja para ciclar la actividad.",
    "Al llegar a la sala, esa necesidad se llena."
  ]},
  { titulo: "NECESIDADES Y MOTINES", lineas: [

    "Necesidad a 0 => motín. Guardias cerca los calman.",
    "Los presos escapan si dejas huecos en el perímetro."
  ]},
  { titulo: "ECONOMÍA", lineas: [
    "Cada día: +$20 por preso, -$15 por guardia.",
    "Construir celdas y salas cuesta dinero.",
    "Al llegar al Día 10 se evalúa la victoria."

];

function drawInstruccionesOverlay() {
  if (!estadoGlobal.mostrandoInstrucciones) return;
  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  const pad = 24, lineH = 18, tituloH = 26, gapSeccion = 14;
  const fontTitulo = "bold 14px monospace";
  const fontCuerpo = "12px monospace";
  const fontHeader = "bold 22px monospace";
  const ancho = Math.min(760, window.innerWidth - 40);
  const colGap = 24;
  const colW = (ancho - pad * 2 - colGap) / 2;
  ctx.font = fontCuerpo;
  const seccionesEnvueltas = [];
  for (let i = 0; i < INSTRUCCIONES.length; i++) {
    const sec = INSTRUCCIONES[i];
    const todasLineas = [];
    for (let j = 0; j < sec.lineas.length; j++) {
      const envueltas = wrapText(sec.lineas[j], colW);
      for (let k = 0; k < envueltas.length; k++) todasLineas.push(envueltas[k]);
    }
    seccionesEnvueltas.push({ titulo: sec.titulo, lineas: todasLineas });
  }
  function alturaColumna(secciones, esCol1) {
    let alto = 0;
    for (let i = 0; i < secciones.length; i++) if ((i % 2 === 0) === esCol1)
      alto += tituloH + secciones[i].lineas.length * lineH + gapSeccion;
    return alto;
  }
  const altoContenido = Math.max(alturaColumna(seccionesEnvueltas, true), alturaColumna(seccionesEnvueltas, false));
  const headerH = 50, pieH = 40;
  const alto = pad * 2 + headerH + altoContenido + pieH;
  const x = Math.floor((window.innerWidth - ancho) / 2);
  const y = Math.floor((window.innerHeight - alto) / 2);
  ctx.fillStyle = "rgba(20,20,40,0.95)";
  ctx.fillRect(x, y, ancho, alto);
  ctx.strokeStyle = "rgba(255,204,68,0.6)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, ancho - 2, alto - 2);
  ctx.fillStyle = "#ffcc44";
  ctx.font = fontHeader; ctx.textBaseline = "top"; ctx.textAlign = "center";
  ctx.fillText("MINIPRISON — INSTRUCCIONES", x + ancho / 2, y + pad);
  ctx.textAlign = "start";
  const col1X = x + pad;
  const col2X = x + pad + colW + colGap;
  let col1Y = y + pad + headerH;
  let col2Y = y + pad + headerH;
  for (let i = 0; i < seccionesEnvueltas.length; i++) {
    const sec = seccionesEnvueltas[i];
    const esCol1 = (i % 2 === 0);
    const cx = esCol1 ? col1X : col2X;
    let cy = esCol1 ? col1Y : col2Y;
    ctx.fillStyle = "#7dcfff"; ctx.font = fontTitulo;
    ctx.fillText(sec.titulo, cx, cy); cy += tituloH;
    ctx.fillStyle = "#e0e0e0"; ctx.font = fontCuerpo;
    for (let j = 0; j < sec.lineas.length; j++) { ctx.fillText(sec.lineas[j], cx, cy); cy += lineH; }
    cy += gapSeccion;
    if (esCol1) col1Y = cy; else col2Y = cy;
  }
  ctx.fillStyle = "#ffcc44";
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  ctx.fillText("Pulsa cualquier tecla o haz clic para empezar", x + ancho / 2, y + alto - 28);
  ctx.textAlign = "start";
}

/* =========================================================
   OVERLAYS
   ========================================================= */
function drawFinDePartida() {
  if (!estadoGlobal.finDePartida) return;
  ctx.fillStyle = "rgba(0,0,0,0.78)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  const esVictoria = estadoGlobal.resultado === "victoria";
  ctx.fillStyle = esVictoria ? "#66ff88" : "#ff4444";
  ctx.font = "bold 48px monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(esVictoria ? "¡VICTORIA!" : "GAME OVER", window.innerWidth / 2, window.innerHeight / 2 - 40);
  ctx.fillStyle = "#e0e0e0";
  ctx.font = "18px monospace";
  ctx.fillText(estadoGlobal.motivoFin, window.innerWidth / 2, window.innerHeight / 2 + 10);
  ctx.font = "16px monospace";
  ctx.fillStyle = "#aaa";
  ctx.fillText("Has llegado al Día " + estadoGlobal.dia, window.innerWidth / 2, window.innerHeight / 2 + 45);
  ctx.fillStyle = "#ffcc44";
  ctx.font = "bold 20px monospace";
  ctx.fillText("Pulsa R para reiniciar", window.innerWidth / 2, window.innerHeight / 2 + 90);
  ctx.textAlign = "start"; ctx.textBaseline = "top";
}

function drawPausaOverlay() {
  if (!estadoGlobal.pausado || estadoGlobal.finDePartida || estadoGlobal.mostrandoInstrucciones) return;
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.fillStyle = "#e0e0e0";
  ctx.font = "bold 32px monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("PAUSA", window.innerWidth / 2, window.innerHeight / 2);
  ctx.textAlign = "start"; ctx.textBaseline = "top";
}

/* =========================================================
   DRAW
   ========================================================= */
/* OPT #4 + #5: viewport culling del grid + tinte.
   Solo dibujamos el rectángulo visible del gridCanvas en vez
   de los 1920×1280 enteros. Y el tinte cubre solo el área
   visible. imageSmoothingEnabled=false (ya seteado) para
   evitar filtrado bilineal costoso. */
function draw(ahoraMs) {
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  if (gridDirty) redibujarGridCache();

  /* rectángulo visible en coordenadas del grid */
  const vw = window.innerWidth  / cam.zoom;
  const vh = window.innerHeight / cam.zoom;
  const sx = Math.max(0, Math.floor((cam.x - vw / 2) / TILE) * TILE);
  const sy = Math.max(0, Math.floor((cam.y - vh / 2) / TILE) * TILE);
  const ex = Math.min(GRID_W, Math.ceil((cam.x + vw / 2) / TILE) * TILE);
  const ey = Math.min(GRID_H, Math.ceil((cam.y + vh / 2) / TILE) * TILE);
  const sw = ex - sx;
  const sh = ey - sy;

  ctx.save();
  ctx.translate(window.innerWidth / 2, window.innerHeight / 2);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);

  if (sw > 0 && sh > 0) {
    ctx.drawImage(gridCanvas, sx, sy, sw, sh, sx, sy, sw, sh);
    const fase = faseDelDia();
    ctx.fillStyle = fase.tinte;
    ctx.fillRect(sx, sy, sw, sh);
  }

  for (let i = 0; i < camiones.length; i++) dibujarCamion(camiones[i]);
  for (let i = 0; i < npcs.length; i++) dibujarNPC(npcs[i], ahoraMs);

  if (hoverCelda && !estadoGlobal.finDePartida && !estadoGlobal.mostrandoInstrucciones) {
    const celda = grid[hoverCelda.row][hoverCelda.col];
    const pintable = celda.tipo !== "carretera";
    ctx.strokeStyle = pintable ? "rgba(255,255,255,0.65)" : "rgba(255,80,80,0.75)";
    ctx.lineWidth = 2 / cam.zoom;
    ctx.strokeRect(hoverCelda.col * TILE + 1, hoverCelda.row * TILE + 1, TILE - 2, TILE - 2);
  }
  ctx.restore();

  if (estadoGlobal.mostrandoInstrucciones) { drawInstruccionesOverlay(); return; }
  drawPausaOverlay();
  drawFinDePartida();
  drawFPS();
  drawBarraEstado();
  drawTipoSeleccionado();
  drawPanelHorario();
  drawMenuControles();
}

/* =========================================================
   CÁMARA
   ========================================================= */
function actualizarCamara(dt) {
  const vel = 600 / cam.zoom;
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    cam.x += (dx / len) * vel * dt;
    cam.y += (dy / len) * vel * dt;
    clampCamera();
  }
}

/* =========================================================
   LOOP
   ========================================================= */
let lastFrameTime = performance.now();

function loop(now) {
  const dtMs = now - lastFrameTime;
  lastFrameTime = now;
  const dt = Math.min(dtMs / 1000, 0.05);

  let ticksRun = 0;
  while (now - lastTick >= TICK_MS && ticksRun < 5) {
    lastTick += TICK_MS;
    tick();
    ticksRun++;
  }
  if (now - lastTick >= TICK_MS) lastTick = now;

  if (puedeSimular()) {
    for (let i = 0; i < camiones.length; i++) actualizarCamion(camiones[i], dt);
    for (let i = camiones.length - 1; i >= 0; i--) {
      if (camiones[i].estado === "saliendo" && camiones[i].x > GRID_W + CAMION_ANCHO) {
        camiones.splice(i, 1);
      }
    }
    for (let i = 0; i < npcs.length; i++) actualizarMovimiento(npcs[i], dt);
  }

  actualizarCamara(dt);

  fpsAccum += dtMs;
  fpsFrames++;
  if (fpsAccum >= 500) {
    fpsValue = Math.round((fpsFrames * 1000) / fpsAccum);
    fpsAccum = 0;
    fpsFrames = 0;
  }

  draw(now);
  requestAnimationFrame(loop);
}

poblarMundo();
requestAnimationFrame(loop);
