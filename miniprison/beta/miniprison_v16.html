<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MiniPrison — v16</title>
<style>
  html, body { margin:0; padding:0; background:#1a1a2e; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
"use strict";

/* =========================================================
   CONFIGURACIÓN GLOBAL
   ========================================================= */
const TILE = 32;
const COLS = 28;
const ROWS = 18;
const GRID_W = TILE * COLS;
const GRID_H = TILE * ROWS;

const COLOR_BG = "#1a1a2e";
const COLOR_GRID = "rgba(255,255,255,0.08)";

const TICK_MS = 1000;
const TICKS_POR_DIA = 60;
const MINUTOS_POR_DIA = 1440;

const NPC_RADIUS = 8;
const VISION_RADIUS = 64;
const VISION_FOV = Math.PI / 3;
const VISION_ALPHA = 0.15;

const NPC_COLORS = {
  preso:   "#ff4444",
  guardia: "#4488ff",
  obrero:  "#ffcc44"
};

const NPC_SPEEDS = {
  preso:   55,
  guardia: 80,
  obrero:  65
};

const SPEED_INQUIETO = 1.6;

const DIA_VICTORIA      = 10;
const PRESOS_PARA_GANAR = 20;
const PRESOS_MINIMOS    = 5;
const MOTINES_MAX       = 3;
const FUGAS_MAX         = 3;

const SPAWN_COL = 0;
const SPAWN_ROW = 0;

const TIPOS_CELDA = {
  vacio:   { color: null,      coste: 0  },
  muro:    { color: "#555555", coste: 10 },
  celda:   { color: "#333355", coste: 50 },
  comedor: { color: "#335533", coste: 30 },
  ducha:   { color: "#334455", coste: 30 },
  patio:   { color: "#555533", coste: 20 }
};

const TECLAS_TIPO = ["vacio", "muro", "celda", "comedor", "ducha", "patio"];

const FASE_AMANECER = { r: 255, g: 140, b: 60,  a: 0.10 };
const FASE_MEDIODIA = { r: 255, g: 230, b: 180, a: 0.03 };
const FASE_TARDE    = { r: 255, g: 120, b: 60,  a: 0.09 };
const FASE_NOCHE    = { r: 10,  g: 10,  b: 40,  a: 0.22 };

const DECAIMIENTO_HAMBRE   = 2;
const DECAIMIENTO_HIGIENE  = 1;
const DECAIMIENTO_LIBERTAD = 0.3;
const PROB_HUIDA           = 0.25;
const LIBERTAD_PARA_CELDA  = 40;
const LIBERTAD_AL_DESCANSAR = 30;

const GRACIA_HUIDA_TICKS = 5;

/* =========================================================
   v16: HORARIO
   6 franjas de 10 ticks (10s reales). Cada franja tiene una
   actividad asignada por defecto. El jugador puede cambiarla
   con clic-ciclo.
   ========================================================= */
const FRANJAS_DIA = 6;
const TICKS_POR_FRANJA = TICKS_POR_DIA / FRANJAS_DIA; // 10

// Actividades disponibles para el ciclo
const ACTIVIDADES = ["celda", "ducha", "comedor", "patio", "libre"];

// Horario por defecto (se puede editar en runtime)
const horario = [
  "celda",    // 00:00 - 04:00 (franja 0)
  "ducha",    // 04:00 - 08:00
  "comedor",  // 08:00 - 12:00
  "patio",    // 12:00 - 16:00
  "comedor",  // 16:00 - 20:00
  "celda"     // 20:00 - 24:00
];

/* =========================================================
   CANVAS
   ========================================================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(window.innerWidth  * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width  = window.innerWidth  + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* =========================================================
   INPUT
   ========================================================= */
const keys = Object.create(null);
let espacioPulsado = false;

window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key.startsWith("Arrow")) e.preventDefault();

  if (estadoGlobal.mostrandoInstrucciones) {
    if (!e.repeat) {
      estadoGlobal.mostrandoInstrucciones = false;
      estadoGlobal.pausado = false;
      estadoGlobal.tickGracia = 0;
      lastTick = performance.now();
      lastFrameTime = performance.now();
    }
    return;
  }

  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k >= "1" && k <= "6") tipoSeleccionado = TECLAS_TIPO[parseInt(k, 10) - 1];
  if (k === " " && !e.repeat && !espacioPulsado && !estadoGlobal.finDePartida) {
    espacioPulsado = true;
    estadoGlobal.pausado = !estadoGlobal.pausado;
  }
  if (k === "r" && !e.repeat && estadoGlobal.finDePartida) reiniciarPartida();
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === " ") espacioPulsado = false;
});
window.addEventListener("blur", () => {
  for (const k in keys) keys[k] = false;
  espacioPulsado = false;
});

/* =========================================================
   RATÓN
   ========================================================= */
let tipoSeleccionado = "muro";
let mouseDown = false;
let lastPaintCol = -1;
let lastPaintRow = -1;

function pantallaACelda(px, py) {
  const off = getGridOffset();
  const gx = px - off.x;
  const gy = py - off.y;
  if (gx < 0 || gy < 0 || gx >= GRID_W || gy >= GRID_H) return null;
  return { col: Math.floor(gx / TILE), row: Math.floor(gy / TILE) };
}

function pintarCelda(col, row, tipo) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return false;
  if (estadoGlobal.finDePartida) return false;
  if (estadoGlobal.mostrandoInstrucciones) return false;
  const celda = grid[row][col];
  if (celda.tipo === "vacio" && tipo === "vacio") return false;
  if (celda.tipo === tipo) return false;
  const coste = TIPOS_CELDA[tipo].coste;
  if (estadoGlobal.dinero < coste) return false;
  estadoGlobal.dinero -= coste;

  if (celda.tipo === "celda" && tipo !== "celda" && celda.asignada) {
    celda.asignada = false;
    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (n.tipo === "preso" && n.celdaAsignada &&
          n.celdaAsignada.col === col && n.celdaAsignada.row === row) {
        n.celdaAsignada = null;
        n.recienLlegado = false;
      }
    }
  }

  celda.tipo = tipo;
  if (tipo === "celda") celda.asignada = false;
  gridDirty = true;

  if (tipo === "muro") {
    for (let i = 0; i < npcs.length; i++) {
      const n = npcs[i];
      if (n.camino && n.camino.length > 0 && n.pasoActual < n.camino.length) {
        const paso = n.camino[n.pasoActual];
        if (paso.col === col && paso.row === row) n.caminoDirty = true;
      }
    }
  }

  return true;
}

/* v16: comprobar clic en el panel de horario */
function clicEnPanelHorario(px, py) {
  if (!panelHorario.visible) return false;
  const x = panelHorario.x;
  const y = panelHorario.y;
  const w = panelHorario.w;
  const h = panelHorario.h;

  if (px < x || px > x + w || py < y || py > y + h) return false;

  // Comprobar si el clic cae en una franja
  const filaH = 20;
  const inicioFilas = y + 30; // después del título
  for (let i = 0; i < FRANJAS_DIA; i++) {
    const fy = inicioFilas + i * filaH;
    if (py >= fy && py < fy + filaH) {
      // Ciclar la actividad
      const actActual = horario[i];
      const idx = ACTIVIDADES.indexOf(actActual);
      const siguiente = ACTIVIDADES[(idx + 1) % ACTIVIDADES.length];
      horario[i] = siguiente;
      // Forzar a los presos a recalcular su objetivo en el siguiente tick
      for (let j = 0; j < npcs.length; j++) {
        const n = npcs[j];
        if (n.tipo === "preso" && !n.huyendo && !n.recienLlegado) {
          n.camino = [];
          n.objetivo = null;
          n.objetivoTipo = null;
          n.caminoDirty = true;
        }
      }
      return true;
    }
  }
  return true; // clic dentro del panel pero fuera de franjas: consumir
}

canvas.addEventListener("mousedown", (e) => {
  if (estadoGlobal.mostrandoInstrucciones) {
    estadoGlobal.mostrandoInstrucciones = false;
    estadoGlobal.pausado = false;
    estadoGlobal.tickGracia = 0;
    lastTick = performance.now();
    lastFrameTime = performance.now();
    return;
  }
  if (e.button !== 0) return;
  if (estadoGlobal.finDePartida) return;

  // v16: comprobar primero si el clic es en el panel de horario
  if (clicEnPanelHorario(e.clientX, e.clientY)) return;

  const celda = pantallaACelda(e.clientX, e.clientY);
  if (!celda) return;
  mouseDown = true;
  pintarCelda(celda.col, celda.row, tipoSeleccionado);
  lastPaintCol = celda.col;
  lastPaintRow = celda.row;
});
canvas.addEventListener("mousemove", (e) => {
  if (!mouseDown) return;
  const celda = pantallaACelda(e.clientX, e.clientY);
  if (!celda) return;
  pintarLinea(lastPaintCol, lastPaintRow, celda.col, celda.row);
  lastPaintCol = celda.col;
  lastPaintRow = celda.row;
});
window.addEventListener("mouseup", () => {
  mouseDown = false;
  lastPaintCol = -1;
  lastPaintRow = -1;
});

function pintarLinea(c0, r0, c1, r1) {
  if (c1 < 0 || r1 < 0) return;
  if (c0 < 0 || r0 < 0) { pintarCelda(c1, r1, tipoSeleccionado); return; }
  let dc = Math.abs(c1 - c0), dr = Math.abs(r1 - r0);
  let sc = c0 < c1 ? 1 : -1, sr = r0 < r1 ? 1 : -1;
  let err = dc - dr, c = c0, r = r0;
  while (true) {
    pintarCelda(c, r, tipoSeleccionado);
    if (c === c1 && r === r1) break;
    const e2 = 2 * err;
    if (e2 > -dr) { err -= dr; c += sc; }
    if (e2 <  dc) { err += dc; r += sr; }
  }
}

/* =========================================================
   OFFSET Y GRID
   ========================================================= */
function getGridOffset() {
  return {
    x: Math.floor((window.innerWidth  - GRID_W) / 2),
    y: Math.floor((window.innerHeight - GRID_H) / 2)
  };
}

const grid = [];
for (let r = 0; r < ROWS; r++) {
  const fila = [];
  for (let c = 0; c < COLS; c++) fila.push({ tipo: "vacio", asignada: false });
  grid.push(fila);
}

let gridDirty = true;

const gridCanvas = document.createElement("canvas");
gridCanvas.width  = GRID_W;
gridCanvas.height = GRID_H;
const gridCtx = gridCanvas.getContext("2d");

function celdaEsTransitable(col, row) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return false;
  return grid[row][col].tipo !== "muro";
}

function puntoEnMuro(x, y) {
  const col = Math.floor(x / TILE);
  const row = Math.floor(y / TILE);
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
  return grid[row][col].tipo === "muro";
}

const indiceCeldasPorTipo = new Map();

function reconstruirIndiceCeldas() {
  indiceCeldasPorTipo.clear();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tipo = grid[r][c].tipo;
      let arr = indiceCeldasPorTipo.get(tipo);
      if (!arr) { arr = []; indiceCeldasPorTipo.set(tipo, arr); }
      arr.push({ col: c, row: r });
    }
  }
}

function redibujarGridCache() {
  gridCtx.clearRect(0, 0, GRID_W, GRID_H);
  gridCtx.fillStyle = "#151526";
  gridCtx.fillRect(0, 0, GRID_W, GRID_H);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const tipo = grid[r][c].tipo;
      const color = TIPOS_CELDA[tipo].color;
      if (color) {
        gridCtx.fillStyle = color;
        gridCtx.fillRect(c * TILE, r * TILE, TILE, TILE);
      }
      if (tipo === "celda" && grid[r][c].asignada) {
        gridCtx.fillStyle = "rgba(255,255,255,0.35)";
        gridCtx.beginPath();
        gridCtx.arc(c * TILE + TILE / 2, r * TILE + TILE / 2, 3, 0, Math.PI * 2);
        gridCtx.fill();
      }
    }
  }

  gridCtx.strokeStyle = COLOR_GRID;
  gridCtx.lineWidth = 1;
  gridCtx.beginPath();
  for (let x = 0; x <= COLS; x++) {
    const px = x * TILE + 0.5;
    gridCtx.moveTo(px, 0); gridCtx.lineTo(px, GRID_H);
  }
  for (let y = 0; y <= ROWS; y++) {
    const py = y * TILE + 0.5;
    gridCtx.moveTo(0, py); gridCtx.lineTo(GRID_W, py);
  }
  gridCtx.stroke();

  gridCtx.strokeStyle = "rgba(255,255,255,0.18)";
  gridCtx.strokeRect(0.5, 0.5, GRID_W, GRID_H);

  gridCtx.fillStyle = "rgba(255,200,100,0.18)";
  gridCtx.fillRect(SPAWN_COL * TILE, SPAWN_ROW * TILE, TILE, TILE);
  gridCtx.strokeStyle = "rgba(255,200,100,0.6)";
  gridCtx.lineWidth = 2;
  gridCtx.strokeRect(SPAWN_COL * TILE + 1, SPAWN_ROW * TILE + 1, TILE - 2, TILE - 2);

  reconstruirIndiceCeldas();
  gridDirty = false;
}

/* =========================================================
   ESTADO GLOBAL
   ========================================================= */
const estadoGlobal = {
  dinero: 1000,
  dia: 1,
  tickDelDia: 0,
  pausado: true,
  mostrandoInstrucciones: true,
  resultado: null,
  finDePartida: false,
  motivoFin: "",
  motinesActuales: 0,
  ultimoDiaCerrado: 0,
  fugas: 0,
  tickGracia: 0
};

function puedeSimular() {
  return !estadoGlobal.pausado && !estadoGlobal.finDePartida && !estadoGlobal.mostrandoInstrucciones;
}

/* v16: obtener franja actual y actividad */
function franjaActual() {
  return Math.floor(estadoGlobal.tickDelDia / TICKS_POR_FRANJA);
}

function actividadActual() {
  const f = franjaActual();
  if (f < 0 || f >= FRANJAS_DIA) return "libre";
  return horario[f];
}

/* v16: tipo de celda asociado a una actividad */
function tipoCeldaDeActividad(act) {
  if (act === "celda") return "celda";
  if (act === "comedor") return "comedor";
  if (act === "ducha") return "ducha";
  if (act === "patio") return "patio";
  return null; // libre
}

/* =========================================================
   NPCs
   ========================================================= */
let nextNPCId = 1;
const npcs = [];
const presosEnMotin = [];

function crearPreso(x, y, celdaDestino) {
  return {
    id: nextNPCId++,
    tipo: "preso",
    x, y,
    angle: Math.random() * Math.PI * 2,
    speed: NPC_SPEEDS.preso,
    speedBase: NPC_SPEEDS.preso,
    color: NPC_COLORS.preso,
    hambre: 80 + Math.random() * 20,
    higiene: 80 + Math.random() * 20,
    libertad: 80 + Math.random() * 20,
    estado: "normal",
    objetivo: null,
    objetivoTipo: null,
    celdaAsignada: celdaDestino,
    recienLlegado: celdaDestino !== null,
    huyendo: false,
    cooldownLlegada: 0,
    camino: [],
    pasoActual: 0,
    caminoDirty: true,
    // v16: actividad actual que está cumpliendo
    actividadActual: null
  };
}

function crearGuardia(x, y) {
  return {
    id: nextNPCId++, tipo: "guardia", x, y,
    angle: Math.random() * Math.PI * 2,
    speed: NPC_SPEEDS.guardia, speedBase: NPC_SPEEDS.guardia,
    color: NPC_COLORS.guardia,
    objetivo: null, presoObjetivo: null, detectoMotin: false,
    camino: [], pasoActual: 0, caminoDirty: true
  };
}

function crearObrero(x, y) {
  return {
    id: nextNPCId++, tipo: "obrero", x, y,
    angle: Math.random() * Math.PI * 2,
    speed: NPC_SPEEDS.obrero, speedBase: NPC_SPEEDS.obrero,
    color: NPC_COLORS.obrero,
    objetivo: null,
    camino: [], pasoActual: 0, caminoDirty: true
  };
}

/* =========================================================
   BFS
   ========================================================= */
function bfsHastaCelda(startCol, startRow, targetCol, targetRow) {
  if (startCol === targetCol && startRow === targetRow) return null;
  if (targetCol < 0 || targetRow < 0 || targetCol >= COLS || targetRow >= ROWS) return null;
  if (grid[targetRow][targetCol].tipo === "muro") return null;

  const total = COLS * ROWS;
  const visitado = new Uint8Array(total);
  const padre = new Int32Array(total).fill(-1);
  const cola = new Int32Array(total);
  let head = 0, tail = 0;

  const startIdx = startRow * COLS + startCol;
  const targetIdx = targetRow * COLS + targetCol;
  visitado[startIdx] = 1;
  cola[tail++] = startIdx;

  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];

  while (head < tail) {
    const idx = cola[head++];
    if (idx === targetIdx) {
      const camino = [];
      let cur = idx;
      while (cur !== -1) {
        camino.push({ col: cur % COLS, row: (cur / COLS) | 0 });
        if (cur === startIdx) break;
        cur = padre[cur];
      }
      camino.reverse();
      if (camino.length > 0 && camino[0].col === startCol && camino[0].row === startRow) camino.shift();
      return camino;
    }
    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    for (let d = 0; d < 4; d++) {
      const nc = col + dirs[d][0];
      const nr = row + dirs[d][1];
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const nIdx = nr * COLS + nc;
      if (visitado[nIdx]) continue;
      if (grid[nr][nc].tipo === "muro") continue;
      visitado[nIdx] = 1;
      padre[nIdx] = idx;
      cola[tail++] = nIdx;
    }
  }
  return null;
}

function bfsCamino(startCol, startRow, tipoBuscado, soloNoAsignadas, excluirCol, excluirRow) {
  if (startCol < 0 || startRow < 0 || startCol >= COLS || startRow >= ROWS) return null;

  const total = COLS * ROWS;
  const visitado = new Uint8Array(total);
  const padre = new Int32Array(total).fill(-1);
  const cola = new Int32Array(total);
  let head = 0, tail = 0;

  const startIdx = startRow * COLS + startCol;
  visitado[startIdx] = 1;
  cola[tail++] = startIdx;

  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  let destinoIdx = -1;

  while (head < tail) {
    const idx = cola[head++];
    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    const celda = grid[row][col];

    if (celda.tipo === tipoBuscado) {
      const esNoAsignada = !soloNoAsignadas || (tipoBuscado === "celda" ? !celda.asignada : true);
      const esDistinta = (col !== excluirCol || row !== excluirRow);
      if (esNoAsignada && esDistinta) {
        destinoIdx = idx;
        break;
      }
    }

    for (let d = 0; d < 4; d++) {
      const nc = col + dirs[d][0];
      const nr = row + dirs[d][1];
      if (nc < 0 || nr < 0 || nc >= COLS || nr >= ROWS) continue;
      const nIdx = nr * COLS + nc;
      if (visitado[nIdx]) continue;
      if (grid[nr][nc].tipo === "muro") continue;
      visitado[nIdx] = 1;
      padre[nIdx] = idx;
      cola[tail++] = nIdx;
    }
  }

  if (destinoIdx === -1) return null;

  const camino = [];
  let idx = destinoIdx;
  while (idx !== -1) {
    camino.push({ col: idx % COLS, row: (idx / COLS) | 0 });
    if (idx === startIdx) break;
    idx = padre[idx];
  }
  camino.reverse();
  if (camino.length > 0 && camino[0].col === startCol && camino[0].row === startRow) camino.shift();
  return camino;
}

function celdaDePunto(x, y) {
  return {
    col: Math.max(0, Math.min(COLS - 1, Math.floor(x / TILE))),
    row: Math.max(0, Math.min(ROWS - 1, Math.floor(y / TILE)))
  };
}

/* =========================================================
   ASIGNACIÓN DE CAMINO
   ========================================================= */
function asignarCamino(npc, tipoBuscado, motivo, soloNoAsignadas) {
  const p = celdaDePunto(npc.x, npc.y);
  const camino = bfsCamino(p.col, p.row, tipoBuscado, soloNoAsignadas, p.col, p.row);
  if (!camino || camino.length === 0) return false;
  npc.camino = camino;
  npc.pasoActual = 0;
  npc.objetivo = motivo;
  npc.objetivoTipo = tipoBuscado;
  npc.caminoDirty = false;
  return true;
}

function asignarCaminoAleatorio(npc, tipoCelda, motivo) {
  const arr = indiceCeldasPorTipo.get(tipoCelda);
  if (!arr || arr.length === 0) return false;
  const p = celdaDePunto(npc.x, npc.y);
  for (let intento = 0; intento < 8; intento++) {
    const dest = arr[Math.floor(Math.random() * arr.length)];
    if (dest.col === p.col && dest.row === p.row) continue;
    const camino = bfsHastaCelda(p.col, p.row, dest.col, dest.row);
    if (camino && camino.length > 0) {
      npc.camino = camino;
      npc.pasoActual = 0;
      npc.objetivo = motivo;
      npc.objetivoTipo = tipoCelda;
      npc.caminoDirty = false;
      return true;
    }
  }
  return false;
}

function asignarCeldaAPreso(preso) {
  const p = celdaDePunto(preso.x, preso.y);
  const camino = bfsCamino(p.col, p.row, "celda", true, p.col, p.row);
  if (camino && camino.length > 0) {
    const destino = camino[camino.length - 1];
    grid[destino.row][destino.col].asignada = true;
    preso.celdaAsignada = destino;
    preso.recienLlegado = true;
    preso.camino = camino;
    preso.pasoActual = 0;
    preso.objetivo = "celda";
    preso.objetivoTipo = "celda";
    preso.caminoDirty = false;
    return true;
  }
  preso.celdaAsignada = null;
  preso.recienLlegado = false;
  return false;
}

function spawnearPreso() {
  const x = SPAWN_COL * TILE + TILE / 2;
  const y = SPAWN_ROW * TILE + TILE / 2;
  const preso = crearPreso(x, y, null);
  asignarCeldaAPreso(preso);
  npcs.push(preso);
  return preso;
}

/* =========================================================
   NECESIDADES
   v16: al llegar a una sala por HORARIO, se llena la
   necesidad correspondiente. Las otras siguen bajando.
   ========================================================= */
function resolverLlegada(npc) {
  if (npc.tipo !== "preso") return;

  // v16: si el objetivo es por horario, llenar necesidad específica
  if (npc.objetivo === "comedor") npc.hambre = 100;
  else if (npc.objetivo === "ducha") npc.higiene = 100;
  else if (npc.objetivo === "celda") {
    npc.libertad = Math.min(100, npc.libertad + LIBERTAD_AL_DESCANSAR);
    if (npc.recienLlegado) npc.recienLlegado = false;
  }

  npc.objetivo = null;
  npc.objetivoTipo = null;
  npc.camino = [];
  npc.pasoActual = 0;
  npc.cooldownLlegada = 2;
  npc.actividadActual = null;
}

/* =========================================================
   HUIDA
   ========================================================= */
function puedeHuir(preso) {
  if (estadoGlobal.tickGracia < GRACIA_HUIDA_TICKS) return false;
  if (preso.recienLlegado) return false;
  if (!preso.celdaAsignada) return false;
  const ca = preso.celdaAsignada;
  if (grid[ca.row][ca.col].tipo !== "celda") return false;

  const p = celdaDePunto(preso.x, preso.y);
  const bordes = [];
  for (let c = 0; c < COLS; c++) { bordes.push({col:c,row:0}); bordes.push({col:c,row:ROWS-1}); }
  for (let r = 0; r < ROWS; r++) { bordes.push({col:0,row:r}); bordes.push({col:COLS-1,row:r}); }

  for (let i = 0; i < bordes.length; i++) {
    const b = bordes[i];
    if (grid[b.row][b.col].tipo === "muro") continue;
    if (hayCamino(p.col, p.row, b.col, b.row)) return true;
  }
  return false;
}

function hayCamino(startCol, startRow, targetCol, targetRow) {
  if (startCol === targetCol && startRow === targetRow) return true;
  if (grid[targetRow][targetCol].tipo === "muro") return false;

  const total = COLS * ROWS;
  const visitado = new Uint8Array(total);
  const cola = new Int32Array(total);
  let head = 0, tail = 0;
  const startIdx = startRow * COLS + startCol;
  const targetIdx = targetRow * COLS + targetCol;
  visitado[startIdx] = 1;
  cola[tail++] = startIdx;

  while (head < tail) {
    const idx = cola[head++];
    if (idx === targetIdx) return true;
    const col = idx % COLS;
    const row = (idx / COLS) | 0;
    if (col > 0) {
      const nIdx = idx - 1;
      if (!visitado[nIdx] && grid[row][col-1].tipo !== "muro") { visitado[nIdx]=1; cola[tail++]=nIdx; }
    }
    if (col < COLS - 1) {
      const nIdx = idx + 1;
      if (!visitado[nIdx] && grid[row][col+1].tipo !== "muro") { visitado[nIdx]=1; cola[tail++]=nIdx; }
    }
    if (row > 0) {
      const nIdx = idx - COLS;
      if (!visitado[nIdx] && grid[row-1][col].tipo !== "muro") { visitado[nIdx]=1; cola[tail++]=nIdx; }
    }
    if (row < ROWS - 1) {
      const nIdx = idx + COLS;
      if (!visitado[nIdx] && grid[row+1][col].tipo !== "muro") { visitado[nIdx]=1; cola[tail++]=nIdx; }
    }
  }
  return false;
}

function iniciarHuida(preso) {
  const bordes = [];
  for (let c = 0; c < COLS; c++) { bordes.push({col:c,row:0}); bordes.push({col:c,row:ROWS-1}); }
  for (let r = 0; r < ROWS; r++) { bordes.push({col:0,row:r}); bordes.push({col:COLS-1,row:r}); }

  const p = celdaDePunto(preso.x, preso.y);
  let mejorCamino = null;
  for (let i = 0; i < bordes.length; i++) {
    const b = bordes[i];
    if (grid[b.row][b.col].tipo === "muro") continue;
    const camino = bfsHastaCelda(p.col, p.row, b.col, b.row);
    if (camino && camino.length > 0) {
      if (!mejorCamino || camino.length < mejorCamino.length) mejorCamino = camino;
    }
  }

  if (!mejorCamino || mejorCamino.length === 0) return false;
  preso.huyendo = true;
  preso.estado = "huyendo";
  preso.speed = preso.speedBase * SPEED_INQUIETO;
  preso.camino = mejorCamino;
  preso.pasoActual = 0;
  preso.objetivo = "escapar";
  preso.objetivoTipo = "borde";
  preso.caminoDirty = false;
  return true;
}

function registrarFuga(preso) {
  const idx = npcs.indexOf(preso);
  if (idx >= 0) npcs.splice(idx, 1);
  if (preso.celdaAsignada) {
    grid[preso.celdaAsignada.row][preso.celdaAsignada.col].asignada = false;
    gridDirty = true;
  }
  estadoGlobal.fugas++;
  if (estadoGlobal.fugas >= FUGAS_MAX && !estadoGlobal.finDePartida) {
    finalizarPartida("derrota", "Demasiadas fugas: " + estadoGlobal.fugas);
  }
}

/* =========================================================
   v16: ASIGNAR OBJETIVO SEGÚN HORARIO
   Devuelve true si asignó algo. Si no hay sala del tipo
   requerido, hace fallback a wander.
   ========================================================= */
function asignarObjetivoPorHorario(preso) {
  const act = actividadActual();

  // Actividad "libre": no forzar, el preso decide por necesidades
  if (act === "libre") return false;

  // Actividad "celda": ir a SU celda asignada
  if (act === "celda") {
    if (!preso.celdaAsignada) return false;
    const ca = preso.celdaAsignada;
    if (grid[ca.row][ca.col].tipo !== "celda") return false;
    const p = celdaDePunto(preso.x, preso.y);
    if (p.col === ca.col && p.row === ca.row) {
      // Ya está en su celda
      preso.actividadActual = "celda";
      return true;
    }
    const camino = bfsHastaCelda(p.col, p.row, ca.col, ca.row);
    if (camino && camino.length > 0) {
      preso.camino = camino;
      preso.pasoActual = 0;
      preso.objetivo = "celda";
      preso.objetivoTipo = "celda";
      preso.actividadActual = "celda";
      preso.caminoDirty = false;
      return true;
    }
    return false;
  }

  // Actividades de sala: buscar la sala más cercana de ese tipo
  // Si ya está DENTRO de una celda de ese tipo, no moverse.
  const tipo = tipoCeldaDeActividad(act);
  if (!tipo) return false;

  const p = celdaDePunto(preso.x, preso.y);
  if (grid[p.row][p.col].tipo === tipo) {
    // Ya está en la sala correcta
    preso.actividadActual = act;
    // v16: llenar la necesidad de esa sala
    if (tipo === "comedor") preso.hambre = 100;
    else if (tipo === "ducha") preso.higiene = 100;
    else if (tipo === "patio") {
      // patio = ocio, sube libertad poco a poco
      preso.libertad = Math.min(100, preso.libertad + 1);
    }
    return true;
  }

  // Buscar camino a la sala más cercana de ese tipo
  const arr = indiceCeldasPorTipo.get(tipo);
  if (!arr || arr.length === 0) return false;

  let mejorCamino = null;
  for (let i = 0; i < arr.length && i < 20; i++) {
    const dest = arr[Math.floor(Math.random() * arr.length)];
    if (dest.col === p.col && dest.row === p.row) continue;
    const camino = bfsHastaCelda(p.col, p.row, dest.col, dest.row);
    if (camino && camino.length > 0) {
      if (!mejorCamino || camino.length < mejorCamino.length) mejorCamino = camino;
    }
  }

  if (mejorCamino && mejorCamino.length > 0) {
    preso.camino = mejorCamino;
    preso.pasoActual = 0;
    preso.objetivo = tipo;
    preso.objetivoTipo = tipo;
    preso.actividadActual = act;
    preso.caminoDirty = false;
    return true;
  }
  return false;
}

/* =========================================================
   TICK DE PRESO
   ========================================================= */
function tickPreso(preso) {
  if (preso.huyendo) {
    if (preso.camino.length === 0) registrarFuga(preso);
    return;
  }

  // Validar celda asignada
  if (preso.celdaAsignada) {
    const c = preso.celdaAsignada.col;
    const r = preso.celdaAsignada.row;
    if (grid[r][c].tipo !== "celda") {
      preso.celdaAsignada = null;
      preso.recienLlegado = false;
      preso.objetivo = null;
      preso.objetivoTipo = null;
      preso.camino = [];
      preso.caminoDirty = true;
    }
  }

  // Recién llegado: prioridad absoluta a su celda
  if (preso.recienLlegado && preso.celdaAsignada) {
    if (preso.caminoDirty) {
      const p = celdaDePunto(preso.x, preso.y);
      const camino = bfsHastaCelda(p.col, p.row, preso.celdaAsignada.col, preso.celdaAsignada.row);
      if (camino) {
        preso.camino = camino;
        preso.pasoActual = 0;
        preso.objetivo = "celda";
        preso.caminoDirty = false;
      }
    }
    if (preso.camino.length === 0) resolverLlegada(preso);
    return;
  }

  // Decaimiento de necesidades
  preso.hambre   = Math.max(0, preso.hambre   - DECAIMIENTO_HAMBRE);
  preso.higiene  = Math.max(0, preso.higiene  - DECAIMIENTO_HIGIENE);
  preso.libertad = Math.max(0, preso.libertad - DECAIMIENTO_LIBERTAD);

  if (preso.libertad <= 0) preso.estado = "motin";
  else if (preso.libertad < 20) preso.estado = "inquieto";
  else preso.estado = "normal";

  if (preso.estado === "inquieto" || preso.estado === "motin") {
    preso.speed = preso.speedBase * SPEED_INQUIETO;
  } else {
    preso.speed = preso.speedBase;
  }

  // Huida
  if (puedeHuir(preso) && Math.random() < PROB_HUIDA) {
    iniciarHuida(preso);
    return;
  }

  // Motín
  if (preso.estado === "motin") {
    if (preso.camino.length === 0) {
      if (!asignarCaminoAleatorio(preso, "patio", "patio")) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    }
    return;
  }

  // Llegada al objetivo
  if (preso.objetivo && preso.camino.length === 0) resolverLlegada(preso);

  if (preso.cooldownLlegada > 0) {
    preso.cooldownLlegada--;
    return;
  }

  // v16: PRIORIDAD 1 — horario
  // Si hay una actividad asignada y no la está cumpliendo, ir a esa sala.
  if (preso.camino.length === 0 && !preso.objetivo) {
    const act = actividadActual();
    if (act !== "libre") {
      // Si ya está en la sala correcta, no hacer nada más este tick
      const p = celdaDePunto(preso.x, preso.y);
      const tipoEsperado = tipoCeldaDeActividad(act);

      if (tipoEsperado && grid[p.row][p.col].tipo === tipoEsperado) {
        // Ya está en la sala: llenar necesidad
        if (tipoEsperado === "comedor") preso.hambre = 100;
        else if (tipoEsperado === "ducha") preso.higiene = 100;
        else if (tipoEsperado === "patio") preso.libertad = Math.min(100, preso.libertad + 1);
        else if (tipoEsperado === "celda") {
          // Está en cualquier celda, pero debería estar en la SUYA
          if (preso.celdaAsignada &&
              (p.col !== preso.celdaAsignada.col || p.row !== preso.celdaAsignada.row)) {
            // Ir a la suya
            const camino = bfsHastaCelda(p.col, p.row, preso.celdaAsignada.col, preso.celdaAsignada.row);
            if (camino && camino.length > 0) {
              preso.camino = camino;
              preso.pasoActual = 0;
              preso.objetivo = "celda";
              preso.objetivoTipo = "celda";
              preso.actividadActual = "celda";
              preso.caminoDirty = false;
            }
          } else {
            preso.libertad = Math.min(100, preso.libertad + LIBERTAD_AL_DESCANSAR);
          }
        }
        preso.actividadActual = act;
        return;
      }

      // No está en la sala correcta: ir
      if (asignarObjetivoPorHorario(preso)) return;
      // Si no pudo asignar, fallback a wander
    }
  }

  // Fallback: comportamiento por necesidades (como v15)
  if (!preso.objetivo && preso.camino.length === 0) {
    if (preso.libertad < LIBERTAD_PARA_CELDA && preso.celdaAsignada) {
      const p = celdaDePunto(preso.x, preso.y);
      const camino = bfsHastaCelda(p.col, p.row, preso.celdaAsignada.col, preso.celdaAsignada.row);
      if (camino && camino.length > 0) {
        preso.camino = camino;
        preso.pasoActual = 0;
        preso.objetivo = "celda";
        preso.objetivoTipo = "celda";
        return;
      }
    }

    if (preso.hambre < 30) {
      if (!asignarCamino(preso, "comedor", "comedor", false)) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    } else if (preso.higiene < 30) {
      if (!asignarCamino(preso, "ducha", "ducha", false)) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    } else {
      if (!asignarCaminoAleatorio(preso, "patio", "patio")) {
        asignarCaminoAleatorio(preso, "vacio", "patio");
      }
    }
  }
}

/* =========================================================
   GUARDIAS
   ========================================================= */
const DIST_DETECTAR_MOTIN = 80;
const DIST_CALMAR        = 18;

function presoEnMotinMasCercano(guardia) {
  let mejor = null, mejorDist = Infinity;
  const gx = guardia.x, gy = guardia.y;
  for (let i = 0; i < presosEnMotin.length; i++) {
    const n = presosEnMotin[i];
    const dx = n.x - gx, dy = n.y - gy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < mejorDist) { mejorDist = d; mejor = n; }
  }
  return mejor;
}

function presoHuyendoMasCercano(guardia) {
  let mejor = null, mejorDist = Infinity;
  const gx = guardia.x, gy = guardia.y;
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.tipo !== "preso" || !n.huyendo) continue;
    const dx = n.x - gx, dy = n.y - gy;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < mejorDist) { mejorDist = d; mejor = n; }
  }
  return mejor;
}

function patrullar(guardia) {
  for (let i = 0; i < 50; i++) {
    const col = Math.floor(Math.random() * COLS);
    const row = Math.floor(Math.random() * ROWS);
    if (celdaEsTransitable(col, row)) {
      const p = celdaDePunto(guardia.x, guardia.y);
      const camino = bfsHastaCelda(p.col, p.row, col, row);
      if (camino && camino.length > 0) {
        guardia.camino = camino;
        guardia.pasoActual = 0;
        guardia.objetivo = "patrulla";
        guardia.caminoDirty = false;
        return;
      }
    }
  }
}

function tickGuardia(guardia) {
  guardia.detectoMotin = false;

  if (guardia.camino.length > 0 && guardia.pasoActual < guardia.camino.length) {
    const paso = guardia.camino[guardia.pasoActual];
    if (grid[paso.row][paso.col].tipo === "muro") {
      guardia.camino = [];
      guardia.caminoDirty = true;
    }
  }

  const huidizo = presoHuyendoMasCercano(guardia);
  if (huidizo) {
    const dx = huidizo.x - guardia.x, dy = huidizo.y - guardia.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < DIST_DETECTAR_MOTIN) {
      const p = celdaDePunto(guardia.x, guardia.y);
      const ph = celdaDePunto(huidizo.x, huidizo.y);
      const camino = bfsHastaCelda(p.col, p.row, ph.col, ph.row);
      if (camino) { guardia.camino = camino; guardia.pasoActual = 0; }
      guardia.objetivo = "perseguir";
      guardia.presoObjetivo = huidizo;
      if (d < DIST_CALMAR) {
        huidizo.huyendo = false;
        huidizo.estado = "normal";
        huidizo.libertad = 50;
        huidizo.speed = huidizo.speedBase;
        huidizo.objetivo = null;
        huidizo.objetivoTipo = null;
        huidizo.camino = [];
        guardia.objetivo = "patrulla";
        guardia.presoObjetivo = null;
        guardia.camino = [];
      }
      return;
    }
  }

  const motin = presoEnMotinMasCercano(guardia);
  if (motin) {
    const dx = motin.x - guardia.x, dy = motin.y - guardia.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < DIST_DETECTAR_MOTIN) {
      guardia.detectoMotin = true;
      const p = celdaDePunto(guardia.x, guardia.y);
      const pm = celdaDePunto(motin.x, motin.y);
      const camino = bfsHastaCelda(p.col, p.row, pm.col, pm.row);
      if (camino) { guardia.camino = camino; guardia.pasoActual = 0; }
      guardia.objetivo = "perseguir";
      guardia.presoObjetivo = motin;
      if (d < DIST_CALMAR) {
        motin.estado = "normal";
        motin.libertad = 50;
        motin.speed = motin.speedBase;
        motin.objetivo = null;
        motin.objetivoTipo = null;
        motin.camino = [];
        guardia.objetivo = "patrulla";
        guardia.presoObjetivo = null;
        guardia.camino = [];
      }
      return;
    }
  }

  if (guardia.objetivo !== "patrulla" || guardia.camino.length === 0) {
    guardia.presoObjetivo = null;
    patrullar(guardia);
  }
}

/* =========================================================
   OBREROS
   ========================================================= */
function tickObrero(obrero) {
  if (obrero.camino.length > 0 && obrero.pasoActual < obrero.camino.length) {
    const paso = obrero.camino[obrero.pasoActual];
    if (grid[paso.row][paso.col].tipo === "muro") {
      obrero.camino = [];
      obrero.caminoDirty = true;
    }
  }
  if (obrero.objetivo !== "patrulla" || obrero.camino.length === 0) {
    for (let i = 0; i < 50; i++) {
      const col = Math.floor(Math.random() * COLS);
      const row = Math.floor(Math.random() * ROWS);
      if (celdaEsTransitable(col, row)) {
        const p = celdaDePunto(obrero.x, obrero.y);
        const camino = bfsHastaCelda(p.col, p.row, col, row);
        if (camino && camino.length > 0) {
          obrero.camino = camino;
          obrero.pasoActual = 0;
          obrero.objetivo = "patrulla";
          break;
        }
      }
    }
  }
}

/* =========================================================
   DIBUJO NPCs
   ========================================================= */
const cacheRgba = new Map();

function hexToRgba(hex, alpha) {
  const clave = hex + "_" + alpha;
  let val = cacheRgba.get(clave);
  if (val !== undefined) return val;
  if (cacheRgba.size >= 64) cacheRgba.clear();
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  val = "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  cacheRgba.set(clave, val);
  return val;
}

function dibujarNPC(npc, offsetX, offsetY, tiempoMs) {
  const sx = npc.x + offsetX;
  const sy = npc.y + offsetY;

  ctx.beginPath();
  ctx.ellipse(sx, sy + NPC_RADIUS * 0.9, NPC_RADIUS * 1.2, NPC_RADIUS * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fill();

  let colorCono = npc.color;
  if (npc.tipo === "preso") {
    if (npc.huyendo) colorCono = "#ffff00";
    else if (npc.estado === "inquieto") colorCono = "#ff8800";
    else if (npc.estado === "motin") colorCono = "#ff0000";
  } else if (npc.tipo === "guardia" && npc.detectoMotin) {
    colorCono = "#ff6666";
  }

  const a1 = npc.angle - VISION_FOV / 2;
  const a2 = npc.angle + VISION_FOV / 2;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx + Math.cos(a1) * VISION_RADIUS, sy + Math.sin(a1) * VISION_RADIUS);
  ctx.lineTo(sx + Math.cos(a2) * VISION_RADIUS, sy + Math.sin(a2) * VISION_RADIUS);
  ctx.closePath();
  ctx.fillStyle = hexToRgba(colorCono, VISION_ALPHA);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, NPC_RADIUS, 0, Math.PI * 2);

  if (npc.tipo === "preso" && npc.huyendo) {
    const pulso = 0.5 + 0.5 * Math.sin(tiempoMs * 0.012);
    ctx.fillStyle = "rgb(255," + Math.floor(200 + 55 * pulso) + ",0)";
  } else if (npc.tipo === "preso" && npc.estado === "motin") {
    const pulso = 0.5 + 0.5 * Math.sin(tiempoMs * 0.008);
    ctx.fillStyle = "rgb(255," + Math.floor(60 + 120 * pulso) + "," + Math.floor(60 + 40 * pulso) + ")";
  } else {
    ctx.fillStyle = npc.color;
  }
  ctx.fill();

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();
}

/* =========================================================
   POBLAR
   ========================================================= */
function posAleatoriaTransitable() {
  const tiposTransitables = ["vacio", "celda", "comedor", "ducha", "patio"];
  const candidatos = [];
  for (let t = 0; t < tiposTransitables.length; t++) {
    const arr = indiceCeldasPorTipo.get(tiposTransitables[t]);
    if (arr) for (let i = 0; i < arr.length; i++) candidatos.push(arr[i]);
  }
  if (candidatos.length > 0) {
    const d = candidatos[Math.floor(Math.random() * candidatos.length)];
    return { x: d.col * TILE + TILE / 2, y: d.row * TILE + TILE / 2 };
  }
  return { x: TILE / 2, y: TILE / 2 };
}

function poblarMundo() {
  for (let i = 0; i < 5; i++) spawnearPreso();
  for (let i = 0; i < 2; i++) {
    const p = posAleatoriaTransitable();
    npcs.push(crearGuardia(p.x, p.y));
  }
  const p = posAleatoriaTransitable();
  npcs.push(crearObrero(p.x, p.y));
}

/* =========================================================
   MOVIMIENTO
   ========================================================= */
function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  return a + diff * t;
}

function actualizarMovimiento(npc, dt) {
  if (npc.camino.length === 0 || npc.pasoActual >= npc.camino.length) {
    npc.angle += 0.01;
    return;
  }

  const paso = npc.camino[npc.pasoActual];
  const targetX = paso.col * TILE + TILE / 2;
  const targetY = paso.row * TILE + TILE / 2;

  const dx = targetX - npc.x;
  const dy = targetY - npc.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist < 4) {
    npc.pasoActual++;
    if (npc.pasoActual >= npc.camino.length) {
      npc.camino = [];
      npc.pasoActual = 0;
      if (npc.tipo === "preso") resolverLlegada(npc);
    }
    return;
  }

  const dirDeseada = Math.atan2(dy, dx);
  const t = Math.min(1, dt * 10);
  npc.angle = lerpAngle(npc.angle, dirDeseada, t);

  const step = npc.speed * dt;
  const pasoMin = Math.min(step, dist);
  const nx = npc.x + Math.cos(dirDeseada) * pasoMin;
  const ny = npc.y + Math.sin(dirDeseada) * pasoMin;

  if (!puntoEnMuro(nx, ny)) {
    npc.x = nx;
    npc.y = ny;
  }
}

/* =========================================================
   ECONOMÍA
   ========================================================= */
const INGRESO_POR_PRESO = 20;
const GASTO_POR_GUARDIA = 15;
const GASTO_POR_OBRERO  = 10;

function contarTipo(tipo) {
  let n = 0;
  for (let i = 0; i < npcs.length; i++) if (npcs[i].tipo === tipo) n++;
  return n;
}

function celdasLibresDeCelda() {
  const arr = indiceCeldasPorTipo.get("celda");
  const total = arr ? arr.length : 0;
  const ocupadas = contarTipo("preso");
  return Math.max(0, total - ocupadas);
}

function cerrarDia() {
  if (estadoGlobal.dia === estadoGlobal.ultimoDiaCerrado) return;
  const presos   = contarTipo("preso");
  const guardias = contarTipo("guardia");
  const obreros  = contarTipo("obrero");
  estadoGlobal.dinero += presos * INGRESO_POR_PRESO;
  estadoGlobal.dinero -= guardias * GASTO_POR_GUARDIA + obreros * GASTO_POR_OBRERO;
  if (estadoGlobal.dinero < 0) {
    estadoGlobal.dinero = 0;
    finalizarPartida("derrota", "Te quedaste sin dinero");
    estadoGlobal.ultimoDiaCerrado = estadoGlobal.dia;
    return;
  }
  estadoGlobal.dia++;
  estadoGlobal.tickDelDia = 0;
  if (estadoGlobal.dia <= DIA_VICTORIA && celdasLibresDeCelda() > 0) spawnearPreso();
  if (estadoGlobal.dia > DIA_VICTORIA) {
    const presosFinal = contarTipo("preso");
    if (presosFinal >= PRESOS_PARA_GANAR) finalizarPartida("victoria", "¡Has construido una prisión exitosa!");
    else if (presosFinal < PRESOS_MINIMOS) finalizarPartida("derrota", "Muy pocos presos al final del día " + DIA_VICTORIA);
    else finalizarPartida("derrota", "No llegaste a " + PRESOS_PARA_GANAR + " presos");
  }
  estadoGlobal.ultimoDiaCerrado = estadoGlobal.dia - 1;
}

function finalizarPartida(resultado, motivo) {
  if (estadoGlobal.finDePartida) return;
  estadoGlobal.finDePartida = true;
  estadoGlobal.pausado = true;
  estadoGlobal.resultado = resultado;
  estadoGlobal.motivoFin = motivo;
}

function comprobarMotines() {
  let motines = 0;
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.tipo === "preso" && n.estado === "motin") motines++;
  }
  estadoGlobal.motinesActuales = motines;
  if (motines >= MOTINES_MAX && !estadoGlobal.finDePartida) {
    finalizarPartida("derrota", "Motín general: " + motines + " presos en motín");
  }
}

function reiniciarPartida() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      grid[r][c].tipo = "vacio";
      grid[r][c].asignada = false;

/* =========================================================
   TICK
   ========================================================= */
let lastTick = performance.now();

function tick() {
  if (!puedeSimular()) return;

  if (estadoGlobal.tickGracia < GRACIA_HUIDA_TICKS) {
    estadoGlobal.tickGracia++;
  }

  estadoGlobal.tickDelDia++;
  if (estadoGlobal.tickDelDia >= TICKS_POR_DIA) {
    cerrarDia();
    if (estadoGlobal.finDePartida) return;
  }
  presosEnMotin.length = 0;
  for (let i = 0; i < npcs.length; i++) {
    const n = npcs[i];
    if (n.tipo === "preso" && n.estado === "motin") presosEnMotin.push(n);
  }
  const snapshot = npcs.slice();
  for (let i = 0; i < snapshot.length; i++) {
    const npc = snapshot[i];
    if (npc.tipo === "preso") tickPreso(npc);
    else if (npc.tipo === "guardia") tickGuardia(npc);
    else if (npc.tipo === "obrero") tickObrero(npc);
  }
  comprobarMotines();
}

/* =========================================================
   HORA Y FASE
   ========================================================= */
function faseDelDia() {
  if (TICKS_POR_DIA <= 0) return { nombre: "Noche", tinte: "rgba(10,10,40,0.22)" };
  const p = estadoGlobal.tickDelDia / TICKS_POR_DIA;
  let a, b, t;
  if (p < 0.25)      { a = FASE_AMANECER; b = FASE_MEDIODIA; t = p / 0.25; }
  else if (p < 0.5)  { a = FASE_MEDIODIA; b = FASE_TARDE;    t = (p - 0.25) / 0.25; }
  else if (p < 0.75) { a = FASE_TARDE;    b = FASE_NOCHE;    t = (p - 0.5) / 0.25; }
  else               { a = FASE_NOCHE;    b = FASE_AMANECER; t = (p - 0.75) / 0.25; }
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  const alpha = a.a + (b.a - a.a) * t;
  let nombre;
  if (p < 0.20) nombre = "Amanecer";
  else if (p < 0.45) nombre = "Mediodía";
  else if (p < 0.70) nombre = "Atardecer";
  else nombre = "Noche";
  return { nombre, tinte: "rgba(" + r + "," + g + "," + bl + "," + alpha.toFixed(3) + ")" };
}

function dosDigitos(n) { return n < 10 ? "0" + n : "" + n; }

function horaDelDia() {
  if (TICKS_POR_DIA <= 0) return "00:00";
  const minutos = Math.floor((estadoGlobal.tickDelDia / TICKS_POR_DIA) * MINUTOS_POR_DIA);
  const hh = Math.floor(minutos / 60) % 24;
  const mm = minutos % 60;
  return dosDigitos(hh) + ":" + dosDigitos(mm);
}

function horaDeFranja(franja) {
  const minutos = Math.floor((franja / FRANJAS_DIA) * MINUTOS_POR_DIA);
  const hh = Math.floor(minutos / 60) % 24;
  const mm = minutos % 60;
  return dosDigitos(hh) + ":" + dosDigitos(mm);
}

/* =========================================================
   WORD-WRAP
   ========================================================= */
function wrapText(texto, maxAncho) {
  const palabras = texto.split(" ");
  const lineas = [];
  let lineaActual = "";
  for (let i = 0; i < palabras.length; i++) {
    const prueba = lineaActual === "" ? palabras[i] : lineaActual + " " + palabras[i];
    if (ctx.measureText(prueba).width <= maxAncho) {
      lineaActual = prueba;
    } else {
      if (lineaActual !== "") lineas.push(lineaActual);
      lineaActual = palabras[i];
    }
  }
  if (lineaActual !== "") lineas.push(lineaActual);
  return lineas;
}

      for (let k = 0; k < envueltas.length; k++) todasLineas.push(envueltas[k]);
    }
    seccionesEnvueltas.push({ titulo: sec.titulo, lineas: todasLineas });
  }

  function alturaColumna(secciones, esCol1) {
    let alto = 0;
    for (let i = 0; i < secciones.length; i++) {
      if ((i % 2 === 0) === esCol1) {
        alto += tituloH + secciones[i].lineas.length * lineH + gapSeccion;
      }
    }
    return alto;
  }
  const altoCol1 = alturaColumna(seccionesEnvueltas, true);
  const altoCol2 = alturaColumna(seccionesEnvueltas, false);
  const altoContenido = Math.max(altoCol1, altoCol2);

  const headerH = 50;
  const pieH = 40;
  const alto = pad * 2 + headerH + altoContenido + pieH;

  const x = Math.floor((window.innerWidth - ancho) / 2);
  const y = Math.floor((window.innerHeight - alto) / 2);

  ctx.fillStyle = "rgba(20,20,40,0.95)";
  ctx.fillRect(x, y, ancho, alto);
  ctx.strokeStyle = "rgba(255,204,68,0.6)";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, ancho - 2, alto - 2);

  ctx.fillStyle = "#ffcc44";
  ctx.font = fontHeader;
  ctx.textBaseline = "top";
  ctx.textAlign = "center";
  ctx.fillText("MINIPRISON — INSTRUCCIONES", x + ancho / 2, y + pad);
  ctx.textAlign = "start";

  const col1X = x + pad;
  const col2X = x + pad + colW + colGap;
  let col1Y = y + pad + headerH;
  let col2Y = y + pad + headerH;

  for (let i = 0; i < seccionesEnvueltas.length; i++) {
    const sec = seccionesEnvueltas[i];
    const esCol1 = (i % 2 === 0);
    const cx = esCol1 ? col1X : col2X;
    let cy = esCol1 ? col1Y : col2Y;

    ctx.fillStyle = "#7dcfff";
    ctx.font = fontTitulo;
    ctx.fillText(sec.titulo, cx, cy);
    cy += tituloH;

    ctx.fillStyle = "#e0e0e0";
    ctx.font = fontCuerpo;
    for (let j = 0; j < sec.lineas.length; j++) {
      ctx.fillText(sec.lineas[j], cx, cy);
      cy += lineH;
    }
    cy += gapSeccion;

    if (esCol1) col1Y = cy; else col2Y = cy;
  }

  ctx.fillStyle = "#ffcc44";
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  ctx.fillText("Pulsa cualquier tecla o haz clic para empezar",
    x + ancho / 2, y + alto - 28);
  ctx.textAlign = "start";
}

/* =========================================================
   OVERLAYS
   ========================================================= */
function drawFinDePartida() {
  if (!estadoGlobal.finDePartida) return;
  ctx.fillStyle = "rgba(0,0,0,0.78)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  const esVictoria = estadoGlobal.resultado === "victoria";
  ctx.fillStyle = esVictoria ? "#66ff88" : "#ff4444";
  ctx.font = "bold 48px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(esVictoria ? "¡VICTORIA!" : "GAME OVER", window.innerWidth / 2, window.innerHeight / 2 - 40);
  ctx.fillStyle = "#e0e0e0";
  ctx.font = "18px monospace";
  ctx.fillText(estadoGlobal.motivoFin, window.innerWidth / 2, window.innerHeight / 2 + 10);
  ctx.font = "16px monospace";
  ctx.fillStyle = "#aaa";
  ctx.fillText("Has llegado al Día " + estadoGlobal.dia, window.innerWidth / 2, window.innerHeight / 2 + 45);
  ctx.fillStyle = "#ffcc44";
  ctx.font = "bold 20px monospace";
  ctx.fillText("Pulsa R para reiniciar", window.innerWidth / 2, window.innerHeight / 2 + 90);
  ctx.textAlign = "start";
  ctx.textBaseline = "top";
}

function drawPausaOverlay() {
  if (!estadoGlobal.pausado || estadoGlobal.finDePartida || estadoGlobal.mostrandoInstrucciones) return;
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.fillStyle = "#e0e0e0";
  ctx.font = "bold 32px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("PAUSA", window.innerWidth / 2, window.innerHeight / 2);
  ctx.textAlign = "start";
  ctx.textBaseline = "top";
}

/* =========================================================
   DRAW
   ========================================================= */
function draw(ahoraMs) {
  const off = getGridOffset();
  ctx.fillStyle = COLOR_BG;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  if (gridDirty) redibujarGridCache();
  ctx.drawImage(gridCanvas, off.x, off.y);

  const fase = faseDelDia();
  ctx.fillStyle = fase.tinte;
  ctx.fillRect(off.x, off.y, GRID_W, GRID_H);

  for (let i = 0; i < npcs.length; i++) dibujarNPC(npcs[i], off.x, off.y, ahoraMs);

  if (estadoGlobal.mostrandoInstrucciones) {
    drawInstruccionesOverlay();
    return;
  }

  drawPausaOverlay();
  drawFinDePartida();
  drawFPS();
  drawBarraEstado();
  drawTipoSeleccionado();
  drawPanelHorario();
  drawMenuControles();
}

/* =========================================================
   LOOP
   ========================================================= */
let lastFrameTime = performance.now();

function loop(now) {
  const dtMs = now - lastFrameTime;
  lastFrameTime = now;
  const dt = Math.min(dtMs / 1000, 0.05);

  let ticksRun = 0;
  while (now - lastTick >= TICK_MS && ticksRun < 5) {
    lastTick += TICK_MS;
    tick();
    ticksRun++;
  }
  if (now - lastTick >= TICK_MS) lastTick = now;

  if (puedeSimular()) {
    for (let i = 0; i < npcs.length; i++) actualizarMovimiento(npcs[i], dt);
  }

  fpsAccum += dtMs;
  fpsFrames++;
  if (fpsAccum >= 500) {
    fpsValue = Math.round((fpsFrames * 1000) / fpsAccum);
    fpsAccum = 0;
    fpsFrames = 0;
  }

  draw(now);
  requestAnimationFrame(loop);
}

poblarMundo();
requestAnimationFrame(loop);
</script>
